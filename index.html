        { text: "Как вы ведёте себя в компании незнакомых людей?", options: { A: "Душа компании, завожу всех.", B: "Стою в углу и молчу, меня не трогайте.", C: "Вежлив, мил, но внутри ледник.", D: "Очень стесняюсь, могу покраснеть и замолчать.", E: "Присматриваюсь, оцениваю, потом выбираю, с кем говорить.", F: "Активно знакомлюсь, но быстро устаю.", G: "Пытаюсь всем угодить, чтобы понравиться.", H: "Держусь рядом с кем-то знакомым, потом осваиваюсь.", I: "Сразу пытаюсь найти общую тему, чтобы разговорить." } },
        { text: "Что вас успокаивает лучше всего?", options: { A: "Громкая музыка или тишина в наушниках.", B: "Визуальная красота: живопись, закат, цветы.", C: "Процесс готовки или выпечки.", D: "Счёт до десяти или перебирание бус.", E: "Объятия и тактильный контакт.", F: "Алкоголь или лёгкие седативные.", G: "Уборка и наведение порядка.", H: "Прогулка на свежем воздухе.", I: "Медитация или дыхательные упражнения." } },
        { text: "Как вы справляетесь с ситуацией, когда вас никто не понимает?", options: { A: "Замыкаюсь и убеждаю себя, что я всегда был один.", B: "Обижаюсь и требую внимания, могу устроить сцену.", C: "Пытаюсь объяснить снова и снова, терпеливо.", D: "Ухожу в творчество или работу.", E: "Ищу хотя бы одного человека, кто поймёт, и цепляюсь за него.", F: "Плачу, но потом успокаиваюсь.", G: "Злюсь и обвиняю других в тупости.", H: "Пытаюсь добиться понимания любым способом.", I: "Принимаю как факт и иду дальше." } },
        { text: "Что для вас самое сложное в работе/учебе?", options: { A: "Дисциплина и режим.", B: "Начальники и авторитеты.", C: "Скука и рутина.", D: "Необходимость работать в команде.", E: "Стресс и выгорание, которые я прячу.", F: "Дедлайны и переработки.", G: "Конкуренция и сравнение с другими.", H: "Монотонность и отсутствие роста.", I: "Ответственность за результат." } },
        { text: "Как вы относитесь к планам на будущее?", options: { A: "Живу одним днём, планы — это иллюзия.", B: "Люблю долгосрочные планы, но боюсь их не выполнить.", C: "Составляю списки и графики, без них тревожно.", D: "Иду по течению, но с маячками.", E: "Есть одна большая мечта, а остальное — детали.", F: "Планирую, но без фанатизма, оставляю место спонтанности.", G: "Не планирую, потому что всё равно всё меняется.", H: "Обожаю строить грандиозные планы, но не всегда их выполняю.", I: "Планирую только самое важное, остальное — как пойдёт." } },
        { text: "Что вы делаете, когда просыпаетесь в плохом настроении?", options: { A: "Всем об этом сообщаю и порчу день окружающим.", B: "Молчу, пью кофе, никого не трогаю.", C: "Иду на пробежку или тренировку.", D: "Рисую или слушаю музыку.", E: "Обнимаю кота/собаку или плюшевую игрушку.", F: "Позволяю себе побыть в плохом настроении полчаса, потом беру себя в руки.", G: "Сразу берусь за работу, чтобы отвлечься.", H: "Принимаю душ и делаю ритуалы хорошего дня.", I: "Жалуюсь партнёру или другу." } },
        { text: "Как вы переживаете разрыв отношений?", options: { A: "Очень тяжело, могу впасть в депрессию с попытками суицида.", B: "Внешне спокойно, а внутри всё сгорает.", C: "Начинаю мстить или доказывать, что я лучше.", D: "Ищу утешения в работе, алкоголе или наркотиках.", E: "Плачу, но иду дальше, потому что жизнь продолжается.", F: "Долго анализирую, что пошло не так, и делаю выводы.", G: "Полностью ухожу в себя и не общаюсь ни с кем месяцами.", H: "Сразу начинаю новые отношения, чтобы заглушить боль.", I: "Ищу поддержку у друзей и семьи." } },
        { text: "Как вы относитесь к деньгам и роскоши?", options: { A: "Роскошь — это безопасность, я люблю красивые вещи.", B: "Деньги — инструмент, не более. Живу скромно.", C: "Легко трачу, люблю делать дорогие подарки близким.", D: "Боюсь бедности, коплю на чёрный день.", E: "Мне всё равно, главное — чтобы любимые были сыты.", F: "Зарабатываю много, но не умею тратить, коплю.", G: "Трачу на себя и на эмоции, не задумываясь.", H: "Считаю каждую копейку, живу экономно.", I: "Деньги для меня — способ свободы, а не самоцель." } },
        { text: "Что для вас важнее: быть любимым или понимаемым?", options: { A: "Любимым. Понимание придёт потом.", B: "Понимаемым. Любовь без понимания — пытка.", C: "И то, и другое, иначе нет смысла.", D: "Мне достаточно уважения и спокойствия.", E: "Принятие таким, какой я есть, даже если не понимают.", F: "Любимым, но не любой ценой.", G: "Понимаемым, даже без любви.", H: "Важно, чтобы ценили мои усилия.", I: "Любовь важнее, потому что понимание может появиться позже." } },
        { text: "Как вы реагируете на чужую боль?", options: { A: "Сразу бегу помогать, даже в ущерб себе.", B: "Сочувствую, но держу дистанцию, боюсь перегрузиться.", C: "Выключаю эмоции, становлюсь холодным.", D: "Плачу вместе с человеком.", E: "Ищу практическое решение: таблетку, деньги, адвоката.", F: "Стараюсь отвлечь человека разговором, не вникая глубоко.", G: "Помогаю, но только если меня попросят.", H: "Переживаю внутри, но внешне остаюсь спокойным.", I: "Злюсь на того, кто причинил боль, и пытаюсь наказать." } },
        { text: "Что вы можете назвать своим главным недостатком?", options: { A: "Иногда я слишком упрям.", B: "Бывает, что я слишком много думаю о мелочах.", C: "Иногда мне трудно быстро принимать решения.", D: "Бывает, что я слишком самокритичен.", E: "Иногда я могу быть слишком прямолинейным.", F: "Иногда мне сложно отпустить прошлые ошибки.", G: "Бывает, что я не искренен.", H: "Иногда я могу быть нетерпеливым.", I: "Иногда я слишком много анализирую ситуации." } },
        { text: "Что вы делаете, если чувствуете, что партнёр к вам охладевает?", options: { A: "Начинаю цепляться сильнее, заваливаю заботой.", B: "Ухожу первым, чтобы не бросили.", C: "Устраиваю скандал и выясняю всё до конца.", D: "Терплю и молчу, надеюсь, что пройдёт.", E: "Даю свободу, если не любит — значит, не судьба.", F: "Пытаюсь выяснить причину и исправить ситуацию.", G: "Психую, но потом беру себя в руки и предлагаю поговорить.", H: "Обращаюсь к психологу за советом.", I: "Прошу перерыв в отношениях, чтобы понять чувства." } },
        { text: "Как вы относитесь к своей сексуальности?", options: { A: "Долгое время скрывал, стыдился, теперь принимаю.", B: "Всегда было нормально, просто не афиширую.", C: "Травмирован прошлым, боюсь близости.", D: "Очень люблю, это важная часть жизни.", E: "Есть особенности, которые я долго не принимал.", F: "Спокойно, но не считаю нужным обсуждать.", G: "Изучаю себя и экспериментирую.", H: "Стыжусь, поэтому избегаю отношений.", I: "Считаю, что это личное и никого не касается." } },
        { text: "Что для вас «дом»?", options: { A: "Место, где я могу быть один и никто не трогает.", B: "Там, где мои любимые люди.", C: "Порядок, чистота, всё по полочкам.", D: "Творческий хаос: краски, глина, ноты.", E: "Дом там, где вкусно пахнет.", F: "Там, где я вырос.", G: "Место, где можно расслабиться и быть собой.", H: "Моя крепость, куда никого не пускаю.", I: "Место, где меня ждут." } },
        { text: "Как вы справляетесь с чувством одиночества?", options: { A: "Терплю, привык, иногда даже нравится.", B: "Заполняю его работой или хобби до изнеможения.", C: "Иду в гости или звоню друзьям.", D: "Плачу и чувствую себя ничтожеством.", E: "Завожу животное.", F: "Смотрю фильмы или сериалы, чтобы заглушить тишину.", G: "Ухожу в онлайн-общение.", H: "Медитирую и пытаюсь понять себя.", I: "Отправляюсь в путешествие." } },
        { text: "Как вы ведёте себя на свидании?", options: { A: "Очаровываю, шучу, делаю комплименты.", B: "Стесняюсь, могу покраснеть и замолчать.", C: "Веду себя естественно, как в жизни.", D: "Проверяю партнёра на прочность.", E: "Устраиваю необычный сюрприз или приключение.", F: "Много говорю о себе, боюсь пауз.", G: "Предпочитаю активное свидание, а не разговоры.", H: "Тщательно готовлюсь и нервничаю.", I: "Пью алкоголь, чтобы расслабиться." } },
        { text: "Как вы относитесь к своей уязвимости?", options: { A: "Скрываю её любой ценой, это моя слабость.", B: "Принимаю, но только с очень близкими.", C: "Стыжусь.", D: "Уязвимость — это моя сила, я не боюсь её показывать.", E: "Боюсь, что если покажу уязвимость, меня используют.", F: "Скрываю, потому что не хочу обременять других.", G: "Позволяю себе быть уязвимым только в одиночестве.", H: "Работаю над этим с психологом.", I: "Постепенно учусь открываться." } },
        { text: "Что вы делаете, когда злитесь?", options: { A: "Могу ударить стену или сломать что-то.", B: "Сжимаю зубы и молчу, потом долго отхожу.", C: "Спорю, доказываю свою правоту.", D: "Ухожу в себя или физически удаляюсь.", E: "Рисую или пишу злые стихи.", F: "Громко кричу, могу что-то кинуть.", G: "Иду в спортзал выплеснуть агрессию.", H: "Пью успокоительное или закуриваю.", I: "Рассказываю другу, жалуюсь." } },
        { text: "Как вы переживаете неудачу?", options: { A: "Виня себя, самобичуюсь днями и ночами.", B: "Злюсь на обстоятельства или других.", C: "Анализирую ошибки, делаю выводы и иду дальше.", D: "Впадаю в апатию, могу бросить начатое.", E: "Расстраиваюсь, но быстро нахожу новую цель.", F: "Плачу, потом беру себя в руки.", G: "Ищу поддержку у близких.", H: "Пью алкоголь, чтобы забыться.", I: "Ухожу в работу с головой." } },
        { text: "Какая черта характера у других вызывает у вас восхищение?", options: { A: "Смелость и прямота.", B: "Терпение и мудрость.", C: "Нежность и забота.", D: "Способность радоваться мелочам.", E: "Ум и хладнокровие.", F: "Чувство юмора и лёгкость.", G: "Сила воли и целеустремлённость.", H: "Эмпатия и умение слушать.", I: "Честность и справедливость." } },
        { text: "Что для вас любовь?", options: { A: "Битва, в которой нужно победить сомнения.", B: "Тихая гавань, где можно отдохнуть.", C: "Одержимость и полное растворение.", D: "Риск, на который идёшь, зная, что можешь разбиться.", E: "Ежедневный труд и выбор оставаться рядом.", F: "Искра, которая может погаснуть или разгореться.", G: "Слияние душ и тел.", H: "Доверие и уважение.", I: "Желание сделать другого счастливым." } },
        { text: "Если бы вы могли загадать одно желание для себя, то какое?", options: { A: "Научиться прощать себя.", B: "Перестать бояться близости.", C: "Обрести внутреннюю свободу.", D: "Найти свой дом и семью.", E: "Стать тем, кем я есть на самом деле.", F: "Исцелиться от травм прошлого.", G: "Стать успешным и богатым.", H: "Жить долго и счастливо.", I: "Помочь всем, кого люблю." } }

const characters = [
    { id:"1.1", name:"Чон Чонгук", fic:"Не все герои носят плащи", pairs: [[1,"A"],[4,"G"],[5,"A"],[7,"A"],[11,"A"],[12,"A"],[13,"A"],[14,"A"],[15,"A"],[16,"A"],[17,"A"],[18,"C"],[25,"A"],[29,"E"],[31,"E"],[34,"A"],[35,"A"],[36,"A"],[37,"D"],[40,"F"]], desc: "«Талантливый киборг» – сначала кусаешь, потом думаешь. Твоя суперсила — невероятное упрямство, суперслабость — пари на три месяца в инвалидной коляске. Не умеешь врать, разрушаешь вечеринки честностью. В любви романтик, даришь цветы и тут же их роняешь." },
    { id:"1.2", name:"Мин Юнги", fic:"Не все герои носят плащи", pairs: [[1,"B"],[2,"B"],[3,"C"],[5,"A"],[7,"E"],[9,"A"],[10,"E"],[12,"B"],[15,"D"],[16,"B"],[18,"F"],[20,"C"],[21,"A"],[25,"D"],[26,"C"],[30,"B"],[31,"F"],[33,"B"],[35,"F"],[36,"B"]], desc: "«Человек-нерв» – разбиваешь зеркала, даришь вертолёты. «Спасатель, который сбегает»: при отвержении уходишь в запой. Ревнив как дракон, заботлив как наседка. Строишь IT-империи, страдаешь в роскоши под Дебюсси." },
    { id:"1.3", name:"Пак Чимин", fic:"Не все герои носят плащи", pairs: [[2,"E"],[3,"B"],[6,"F"],[7,"C"],[8,"I"],[10,"D"],[12,"F"],[13,"I"],[14,"F"],[15,"G"],[16,"C"],[18,"E"],[20,"G"],[21,"C"],[22,"I"],[23,"F"],[28,"A"],[29,"B"],[32,"B"],[35,"I"]], desc: "«Дай бог каждому такого брата» – держишь всех на плечах, боишься быть недостаточно хорошим. Эмоционально устойчив до жути, но слишком долго терпишь. Кардиостимулятор для битых персонажей." },
    { id:"1.4", name:"Ким Тэхён", fic:"Не все герои носят плащи", pairs: [[2,"B"],[4,"A"],[5,"E"],[6,"A"],[8,"E"],[9,"B"],[10,"C"],[11,"F"],[13,"D"],[14,"G"],[16,"D"],[18,"H"],[19,"C"],[20,"A"],[22,"C"],[23,"A"],[25,"B"],[27,"E"],[34,"E"],[38,"A"]], desc: "«Эстет и немножечко садист» – избегающий тип, веришь что отношения развалятся через три месяца. Носишь белую шубу, слушаешь Вагнера, паникуешь от «нам надо поговорить». Умеешь носить на руках и делать предложения под рояль." },
    { id:"1.5", name:"Чон Хосок", fic:"Не все герои носят плащи", pairs: [[1,"H"],[2,"A"],[3,"E"],[6,"B"],[8,"H"],[13,"E"],[14,"E"],[15,"E"],[18,"G"],[19,"A"],[21,"F"],[23,"H"],[24,"I"],[26,"E"],[27,"A"],[28,"D"],[30,"G"],[33,"C"],[34,"F"],[40,"I"]], desc: "«Батарейка с полиаморным потенциалом» – с кровью горячей, считаешь младших братьев своими детьми. Не выносишь одиночества, компенсируешь громким смехом. Окажешься в центре странной, но тёплой семьи." },
    { id:"1.6", name:"Ким Намджун", fic:"Не все герои носят плащи", pairs: [[1,"E"],[2,"G"],[6,"C"],[8,"C"],[13,"C"],[14,"D"],[15,"C"],[18,"B"],[19,"E"],[20,"B"],[21,"I"],[23,"D"],[26,"I"],[27,"B"],[28,"E"],[29,"I"],[32,"G"],[35,"B"],[39,"H"],[40,"H"]], desc: "«Мудрый корень» – выращиваешь бонсай, рассуждаешь о любви вместо драк. Вызвал скорую Чонгуку и не растерялся. Терпение камня, но когда решаешься – расцветаешь." },
    { id:"1.7", name:"Ким Сокджин", fic:"Не все герои носят плащи", pairs: [[3,"I"],[5,"B"],[6,"H"],[11,"B"],[12,"F"],[13,"F"],[14,"F"],[15,"B"],[17,"H"],[18,"H"],[19,"I"],[24,"F"],[26,"G"],[27,"C"],[28,"F"],[30,"F"],[31,"G"],[33,"G"],[37,"E"],[38,"D"]], desc: "«Ироничный киборг» – шутишь до упаду, потому что протез. Стратегия: «Смеюсь, значит, живу». Травму переигрываешь в комедию. Самый здоровый из всех нездоровых." },
    { id:"2.1", name:"Чон Чонгук (Хаттори)", fic:"Великая сила искусства", pairs: [[2,"C"],[3,"A"],[4,"D"],[5,"C"],[6,"I"],[8,"D"],[9,"E"],[11,"C"],[12,"D"],[14,"B"],[17,"G"],[18,"A"],[21,"D"],[25,"G"],[26,"A"],[30,"C"],[32,"H"],[35,"E"],[36,"G"],[39,"B"]], desc: "«Самурай с татуировками» – чёрная одежда, псевдоним, тотальный контроль. На деле стеклодув, плачущий в одиночестве. Ревнив, но умеешь прощать. Если помыл посуду – это метафора очищения кармы." },
    { id:"2.2", name:"Пак Чимин", fic:"Великая сила искусства", pairs: [[3,"G"],[4,"F"],[5,"D"],[7,"B"],[8,"A"],[12,"G"],[13,"G"],[20,"D"],[22,"E"],[29,"D"],[30,"A"],[31,"A"],[32,"C"],[33,"A"],[34,"H"],[35,"G"],[36,"D"],[37,"A"],[39,"C"],[40,"A"]], desc: "«Тиран, который крякает» – маниакальный порядок, каллиграфия, жизнь по расписанию. Скрывал ориентацию – чуть не застрелился. Когда хорошо – крякаешь. Психотип: или идеальный порядок, или самоуничтожение." },
    { id:"2.3", name:"Мин Юнги", fic:"Великая сила искусства", pairs: [[2,"D"],[4,"B"],[5,"F"],[6,"E"],[7,"F"],[8,"A"],[9,"D"],[10,"F"],[11,"I"],[15,"I"],[16,"I"],[17,"E"],[18,"I"],[20,"E"],[22,"B"],[23,"E"],[24,"B"],[26,"D"],[27,"G"],[28,"C"]], desc: "«Лис, инсценировавший свою смерть» – гениальный неуч, голоса в голове шепчут «ты недостоин». Стратегия: умереть официально, жить нелегально. Пишешь стихи на теле, боишься близости. Твой голос гипнотизирует ФБР." },
    { id:"2.4", name:"Ким Тэхён", fic:"Великая сила искусства", pairs: [[10,"H"],[13,"H"],[15,"H"],[19,"F"],[22,"F"],[23,"I"],[24,"D"],[27,"F"],[28,"H"],[30,"I"],[31,"D"],[32,"I"],[33,"I"],[34,"G"],[35,"D"],[36,"C"],[37,"C"],[38,"I"],[39,"I"],[40,"H"]], desc: "«Гроза преступников с саксофоном» – рано потерял родителей, притворяешься легкомысленным. Галантен с девушками, но верен мужчине. Садишься на колени к друзьям, говоришь «я бесконечно тебя люблю». Тащишь на себе весь сюжет." },
    { id:"2.5", name:"Ким Намджун", fic:"Великая сила искусства", pairs: [[4,"G"],[5,"B"],[6,"G"],[7,"F"],[8,"A"],[12,"F"],[13,"I"],[14,"F"],[16,"F"],[17,"H"],[18,"D"],[19,"H"],[21,"B"],[22,"H"],[23,"C"],[26,"B"],[28,"H"],[32,"B"],[39,"E"],[40,"I"]], desc: "«Умный папа с ямочками на щеках» – знаешь 6 языков, долго не мог сказать «люблю». Суперсила – объятия. Ужасно поёшь – и это прекрасно. Если ты в комнате, скоро там будет уютно и безопасно." },
    { id:"2.6", name:"Ким Сокджин", fic:"Великая сила искусства", pairs: [[1,"B"],[6,"F"],[7,"H"],[8,"F"],[13,"E"],[14,"E"],[15,"H"],[16,"B"],[17,"A"],[18,"G"],[19,"C"],[20,"B"],[26,"A"],[27,"B"],[28,"E"],[29,"F"],[35,"F"],[38,"B"],[39,"B"],[40,"F"]], desc: "«Бриллиант с травмой Лаоса» – элегантный, любит клубнику, не выносит японский язык. Умеешь стрелять между бровей, но предпочитаешь поить чаем. Не веришь, что достоин счастья." },
    { id:"2.7", name:"Чон Хосок", fic:"Великая сила искусства", pairs: [[2,"A"],[3,"H"],[5,"E"],[6,"B"],[8,"H"],[9,"A"],[11,"D"],[12,"D"],[14,"A"],[18,"F"],[19,"A"],[24,"I"],[25,"D"],[26,"C"],[33,"C"],[34,"A"],[36,"F"],[37,"H"],[39,"F"],[40,"H"]], desc: "«Плейбой с английскими ирисками» – яркий, лёгкий на подъём. Был роман с Чонгуком, неразделёнка с Юнги, потом переосмысление. Импульсивен и раним. В итоге – семьянин. И ты всё ещё классно танцуешь." },
    { id:"3.1", name:"Чон Хосок", fic:"Солнечная улыбка убийцы", pairs: [[1,"B"],[3,"C"],[4,"B"],[9,"H"],[12,"A"],[16,"B"],[17,"A"],[21,"A"],[24,"E"],[25,"G"],[27,"E"],[28,"D"],[29,"D"],[31,"C"],[32,"A"],[33,"D"],[35,"F"],[36,"B"],[37,"D"],[40,"F"]], desc: "«Сломленный солнечный зайчик» – взял чужую вину, в тюрьме шьёшь игрушки и пишешь сказки. Ложное чувство вины размером с Галактику. Девиз: «Я не заслужил дышать… ой, а оказывается, заслужил»." },
    { id:"3.2", name:"Ким Тэхён", fic:"Солнечная улыбка убийцы", pairs: [[1,"I"],[2,"E"],[3,"D"],[5,"G"],[10,"E"],[12,"D"],[17,"G"],[19,"B"],[20,"D"],[21,"F"],[24,"D"],[25,"B"],[27,"B"],[28,"B"],[31,"C"],[32,"H"],[34,"H"],[35,"G"],[36,"D"],[40,"B"]], desc: "«Хриплый ангел со счётом до десяти» – боишься прикосновений, считаешь браслеты. Доверяешь только тому, кто сам битый. Учебник по преодолению ПТСР в картинках (которые сам рисуешь)." },
    { id:"3.3", name:"Ким Сокджин", fic:"Солнечная улыбка убийцы", pairs: [[1,"B"],[6,"I"],[7,"C"],[12,"I"],[13,"E"],[14,"F"],[16,"A"],[17,"H"],[18,"E"],[19,"F"],[22,"E"],[24,"H"],[26,"A"],[28,"C"],[29,"B"],[30,"F"],[32,"B"],[35,"F"],[38,"G"],[40,"I"]], desc: "«Гиперопекающий краш» – пожертвовал личной жизнью ради брата с травмой. Пьёшь ромашковый чай, выглядишь как кинозвезда, внутри выгорание. С тобой безопасно, но стену нужно сначала уговорить." },
    { id:"3.4", name:"Мин Юнги", fic:"Солнечная улыбка убийцы", pairs: [[3,"B"],[4,"D"],[6,"C"],[7,"C"],[8,"B"],[11,"C"],[13,"I"],[14,"D"],[15,"C"],[17,"H"],[18,"A"],[19,"E"],[22,"I"],[24,"B"],[26,"B"],[28,"E"],[29,"B"],[32,"C"],[36,"B"],[37,"C"]], desc: "«Молчаливый детектив с кофе и ремонтом» – выражаешь любовь через ремонт и внимательность. Утренняя злюка, без кофе ты не хирург, а бомж. Включаешь здравый смысл, когда все паникуют." },
    { id:"3.5", name:"Пак Чимин", fic:"Солнечная улыбка убийцы", pairs: [[2,"A"],[3,"A"],[5,"B"],[6,"F"],[8,"I"],[10,"A"],[13,"F"],[14,"E"],[15,"H"],[18,"C"],[19,"I"],[21,"D"],[22,"C"],[23,"A"],[25,"E"],[27,"C"],[28,"A"],[29,"E"],[33,"G"],[34,"A"]], desc: "«Тактильный тайный порнописатель» – пережил рак, ценишь каждую секунду. Носишь белое, катаешься на лонгборде, обнимаешь всех подряд. В тайне пишешь горячие романы. Философия: «Жизнь коротка, обниму сейчас»." },
    { id:"3.6", name:"Ким Намджун", fic:"Солнечная улыбка убийцы", pairs: [[2,"C"],[4,"G"],[6,"A"],[11,"B"],[13,"E"],[14,"B"],[16,"G"],[18,"G"],[20,"I"],[21,"B"],[23,"D"],[25,"F"],[26,"I"],[27,"B"],[28,"I"],[32,"I"],[33,"A"],[35,"B"],[38,"D"],[40,"D"]], desc: "«Заботливый медведь с ямочками и тату 707» – сидишь в тюрьме за самооборону, тоскуешь по дочери. Играешь роль папы для Хосока. Не кричишь – действуешь. Если сказал «я люблю» – это навсегда. Ямочки убивают наповал." },
    { id:"4.1", name:"Ким Намджун", fic:"Дракона подавать холодным", pairs: [[2,"B"],[4,"D"],[5,"F"],[6,"A"],[7,"B"],[8,"A"],[11,"C"],[12,"A"],[13,"I"],[14,"D"],[16,"E"],[20,"D"],[21,"A"],[26,"B"],[28,"C"],[32,"H"],[35,"A"],[36,"B"],[39,"E"],[40,"A"]], desc: "«Аскетичный вулкан с чувством вины» – сбежал от криминала, выращиваешь овощи. Думаешь, что ты чудовище. Путь от дракона до домашнего кота, который всё ещё может убить, но не хочет." },
    { id:"4.2", name:"Ким Сокджин", fic:"Дракона подавать холодным", pairs: [[2,"C"],[4,"D"],[5,"A"],[6,"I"],[10,"E"],[12,"F"],[14,"G"],[15,"G"],[16,"A"],[18,"A"],[19,"C"],[20,"C"],[22,"E"],[23,"B"],[27,"B"],[28,"A"],[30,"F"],[37,"I"],[39,"E"],[40,"A"]], desc: "«Ледяная маска с кипящим внутри рагу» – строишь ресторан мечты матери. Носишь ледяную маску, боишься доверять. Кулинарный самурай: режешь лук и плачешь не от него." },
    { id:"4.3", name:"Ким Тэхён", fic:"Дракона подавать холодным", pairs: [[1,"H"],[2,"E"],[4,"C"],[5,"E"],[7,"A"],[8,"D"],[10,"C"],[14,"E"],[16,"B"],[17,"B"],[18,"H"],[22,"A"],[24,"A"],[30,"C"],[34,"F"],[35,"A"],[36,"F"],[37,"D"],[38,"A"],[40,"B"]], desc: "«Та ещё ведьма» – не стал актёром, но играешь драму каждый день. Ревнив, вспыльчив, можешь быть колючим. Стратегия: «Ударь первым, чтобы не ударили тебя». Красив до безобразия и после." },
    { id:"4.4", name:"Чон Чонгук", fic:"Дракона подавать холодным", pairs: [[1,"C"],[2,"E"],[6,"H"],[8,"B"],[9,"B"],[11,"F"],[13,"D"],[15,"D"],[18,"D"],[21,"E"],[23,"C"],[25,"C"],[26,"E"],[29,"A"],[31,"B"],[33,"F"],[34,"D"],[36,"E"],[38,"B"],[39,"C"]], desc: "«Верующий упрямец с внутренним грехом» – религия и любовь к Тэхёну воюют внутри. Аккуратист, страдаешь от мигрени. Считаешь, что любить мужчину – грех, но не можешь без этого. Путь от правильного католика до счастливого грешника." },
    { id:"4.5", name:"Мин Юнги", fic:"Дракона подавать холодным", pairs: [[2,"D"],[3,"G"],[5,"C"],[7,"E"],[9,"F"],[10,"B"],[12,"B"],[13,"A"],[14,"I"],[16,"D"],[19,"H"],[21,"G"],[24,"C"],[25,"F"],[27,"D"],[31,"E"],[32,"A"],[33,"H"],[37,"F"],[38,"G"]], desc: "«Циничный мститель с глубокой раной» – приехал травить брата, которого не знал. Защита – ненависть вместо боли. Мрачный, циничный, но внутри – романтик. Путь от «я отомщу» до «я люблю и принимаю»." },
    { id:"4.6", name:"Пак Чимин", fic:"Дракона подавать холодным", pairs: [[1,"E"],[4,"D"],[5,"A"],[8,"G"],[10,"B"],[12,"H"],[14,"A"],[15,"F"],[17,"I"],[19,"D"],[20,"G"],[22,"C"],[24,"E"],[26,"F"],[28,"C"],[31,"B"],[34,"C"],[35,"E"],[37,"I"],[40,"C"]], desc: "«Немой, но талантливый» – не говоришь из-за травмы, но мурлычешь, когда гладят. Кондитерский гений. В любви обретаешь голос. Невербальная коммуникация громче слов." },
    { id:"4.7", name:"Чон Хосок", fic:"Дракона подавать холодным", pairs: [[2,"A"],[3,"A"],[4,"D"],[5,"E"],[6,"B"],[9,"D"],[11,"A"],[13,"F"],[14,"A"],[18,"F"],[19,"A"],[23,"E"],[24,"I"],[25,"D"],[27,"F"],[30,"B"],[33,"C"],[34,"A"],[36,"F"],[39,"A"]], desc: "«Энерджайзер с грядками» – делаешь лучший кофе, выращиваешь травы. Эмоциональный центр триады. Садовник душ: поливаешь, удобряешь и ждёшь, пока расцветут колючие кактусы." },
    { id:"5.1", name:"Чон Чонгук", fic:"О праведное пламя!", pairs: [[2,"E"],[4,"C"],[6,"D"],[9,"G"],[10,"H"],[12,"B"],[15,"A"],[17,"E"],[19,"F"],[21,"B"],[23,"C"],[25,"H"],[26,"D"],[28,"F"],[31,"E"],[32,"G"],[35,"C"],[37,"B"],[38,"D"],[40,"A"]], desc: "«Булка под маской генерала» – научили только воевать, не понимаешь чувств. Считаешь себя сломленным. Огонь не страшен, страшны чувства. Путь от боевой машины до мужа и виноградаря." },
    { id:"5.2", name:"Чон Хосок", fic:"О праведное пламя!", pairs: [[1,"F"],[3,"A"],[5,"E"],[7,"G"],[8,"C"],[11,"H"],[12,"D"],[14,"A"],[16,"B"],[18,"F"],[20,"A"],[22,"G"],[24,"E"],[27,"C"],[29,"F"],[30,"E"],[33,"C"],[34,"A"],[36,"F"],[39,"B"]], desc: "«Сломленная, но горящая святыня» – прошёл рабство и насилие, сохранил солнечную суть. Умеешь прощать – чудо. Связан с лошадьми и огнём. Нежность сильнее жестокости. Можешь поджечь врага взглядом." },
    { id:"5.3", name:"Ким Намджун", fic:"О праведное пламя!", pairs: [[4,"G"],[5,"D"],[7,"B"],[9,"B"],[11,"C"],[13,"E"],[14,"D"],[16,"G"],[18,"G"],[20,"I"],[21,"C"],[23,"F"],[26,"B"],[28,"I"],[30,"A"],[32,"H"],[33,"A"],[35,"B"],[39,"E"],[40,"D"]], desc: "«Мудрый миротворец с палочкой» – никогда не проигрываешь в чатурангу. Хромаешь, но не жалуешься. Твоё спокойствие заставляет других успокоиться просто потому, что ты рядом." },
    { id:"5.4", name:"Ким Сокджин", fic:"О праведное пламя!", pairs: [[1,"D"],[5,"G"],[6,"I"],[7,"F"],[10,"E"],[12,"C"],[15,"H"],[16,"A"],[17,"B"],[20,"F"],[22,"E"],[24,"I"],[26,"A"],[29,"C"],[30,"F"],[32,"B"],[35,"F"],[36,"D"],[38,"G"],[40,"I"]], desc: "«Красивый манипулятор с травмой» – потерял жену и сына, носишь маску холодного царедворца. Ненавидишь огонь. Видишь суть людей. Путь от машины государства до счастливого мужа." },
    { id:"5.5", name:"Мин Юнги", fic:"О праведное пламя!", pairs: [[2,"D"],[3,"F"],[6,"B"],[8,"C"],[9,"E"],[11,"H"],[12,"G"],[14,"I"],[15,"A"],[17,"D"],[19,"F"],[22,"B"],[24,"C"],[25,"E"],[28,"H"],[31,"D"],[32,"A"],[33,"G"],[37,"C"],[38,"F"]], desc: "«Безумный цветовод с нитями судеб» – видишь будущее, живёшь с проклятием безумия. Носишь белое, говоришь загадками. Путь от проклятого пророка до свободного художника." },
    { id:"5.6", name:"Ким Тэхён", fic:"О праведное пламя!", pairs: [[1,"H"],[2,"E"],[4,"C"],[5,"E"],[8,"D"],[10,"C"],[13,"B"],[14,"E"],[17,"G"],[19,"B"],[21,"F"],[24,"A"],[25,"C"],[27,"B"],[30,"C"],[31,"A"],[34,"F"],[35,"A"],[36,"D"],[40,"B"]], desc: "«Ребёнок-феникс в красном» – 20 лет в заточении, вышел любопытным и добрым. Боишься белого, любишь красное. Не умеешь врать. Философия: «Свобода – когда можно рисовать даже на стенах»." },
    { id:"5.7", name:"Пак Чимин", fic:"О праведное пламя!", pairs: [[1,"E"],[2,"A"],[5,"B"],[8,"F"],[10,"A"],[12,"H"],[13,"F"],[14,"E"],[15,"H"],[18,"C"],[19,"D"],[21,"D"],[22,"C"],[24,"E"],[26,"F"],[29,"C"],[31,"B"],[34,"A"],[35,"E"],[38,"I"]], desc: "«Хрупкий тростник, который не ломается» – был продан в рабство, сохранил нежность и талант. Играешь на флейте. Путь от украшения дома до самостоятельной личности." },
    { id:"6.1", name:"Ким Тэхён", fic:"Танец с невидимым врагом", pairs: [[1,"I"],[2,"E"],[4,"C"],[5,"G"],[8,"D"],[10,"C"],[12,"B"],[14,"E"],[16,"D"],[17,"G"],[19,"B"],[21,"F"],[24,"A"],[25,"B"],[27,"B"],[31,"E"],[32,"H"],[34,"F"],[36,"D"],[40,"B"]], desc: "«Умирающий лев с пистолетом на могиле» – 50 лет, болен хореей Гентингтона. Отказываешься от любви, потому что «зачем, если умру». Путь от «я должен страдать» до «я имею право жить»." },
    { id:"6.2", name:"Чон Хосок", fic:"Танец с невидимым врагом", pairs: [[3,"A"],[5,"E"],[6,"B"],[8,"H"],[9,"D"],[11,"A"],[13,"F"],[14,"A"],[18,"F"],[19,"A"],[22,"G"],[23,"E"],[24,"E"],[26,"D"],[27,"F"],[30,"B"],[33,"C"],[34,"A"],[36,"F"],[39,"A"]], desc: "«Молодой наглец с тату бабочки» – с детства вырезал фото Тэхёна, чтобы ненавидеть. Пришёл мстить, а влюбился. Месть превращается в любовь. Боишься воды, но готов нырнуть в отношения." },
    { id:"7.1", name:"Ким Тэхён", fic:"Последнее желание", pairs: [[1,"H"],[2,"E"],[4,"C"],[5,"E"],[8,"D"],[10,"C"],[13,"B"],[14,"E"],[16,"B"],[17,"B"],[18,"H"],[19,"B"],[22,"A"],[24,"A"],[30,"C"],[34,"F"],[35,"A"],[36,"F"],[38,"A"],[40,"B"]], desc: "«Эмоциональная губка с тревожностью» – ведёшь блокнот желаний, чтобы не умереть от тоски. Быстро привязываешься, боишься повторения боли. Путь от страха нового до смелого мужа." },
    { id:"7.2", name:"Мин Юнги", fic:"Последнее желание", pairs: [[2,"D"],[3,"G"],[5,"C"],[8,"C"],[9,"F"],[11,"H"],[12,"B"],[14,"I"],[15,"D"],[19,"H"],[22,"B"],[24,"C"],[25,"F"],[27,"D"],[31,"E"],[32,"A"],[33,"H"],[35,"D"],[37,"F"],[38,"G"]], desc: "«Отстранённый романтик со шрамом» – не чувствуешь желаний, готовишься умереть от болезни сердца. Тэхён вытаскивает тебя в жизнь. Путь от живого трупа до отчаянно живого." },
    { id:"7.3", name:"Чон Хосок", fic:"Последнее желание", pairs: [[1,"F"],[2,"A"],[5,"E"],[7,"G"],[8,"C"],[11,"H"],[12,"D"],[14,"A"],[16,"B"],[18,"F"],[20,"A"],[22,"G"],[24,"E"],[27,"C"],[29,"F"],[30,"E"],[33,"C"],[34,"A"],[36,"H"],[39,"B"]], desc: "«Наседка с графиком» – живёшь по расписанию, чтобы контролировать тревогу. Убираешь, готовишь, заботишься. Путь от организатора быта до чувственного мужчины." },
    { id:"7.4", name:"Чон Чонгук", fic:"Последнее желание", pairs: [[1,"C"],[3,"E"],[6,"H"],[8,"B"],[9,"D"],[11,"F"],[13,"D"],[15,"D"],[18,"D"],[21,"E"],[23,"C"],[25,"C"],[26,"E"],[29,"A"],[31,"B"],[33,"E"],[34,"F"],[36,"E"],[37,"G"],[38,"B"]], desc: "«Энергичный жаворонок с травмой утраты» – сбежал от боли потери матери. Тактильный, прямолинейный, язвительный в шутках. Учишься быть ведомым – для тебя это подвиг." },
    { id:"7.5", name:"Ким Намджун", fic:"Последнее желание", pairs: [[1,"E"],[2,"C"],[3,"C"],[4,"G"],[5,"B"],[6,"C"],[7,"C"],[8,"C"],[10,"B"],[12,"F"],[13,"A"],[14,"B"],[15,"C"],[16,"E"],[18,"G"],[21,"C"],[27,"B"],[32,"I"],[35,"B"],[39,"H"]], desc: "«Вечные хризантемы не вянут» – разучился чувствовать через объектив. Сожалеешь о прошлых поверхностных связях. Учишься не физической, а эмоциональной близости." },
    { id:"7.6", name:"Ким Сокджин", fic:"Последнее желание", pairs: [[1,"C"],[2,"C"],[3,"G"],[4,"G"],[5,"I"],[6,"C"],[7,"C"],[10,"B"],[11,"B"],[12,"B"],[13,"E"],[15,"I"],[16,"I"],[18,"C"],[19,"C"],[21,"A"],[25,"F"],[27,"B"],[32,"B"],[39,"E"]], desc: "«Талантливый донор» – делаешь керамику, скрываешь печаль. Добросердечен до самопожертвования. Твоя доброта – и сила, и проклятие. Самый грустный персонаж. Иди обними кого-нибудь." },
    { id:"8.1", name:"Ким Намджун", fic:"Птенчик", pairs: [[1,"B"],[2,"B"],[3,"G"],[4,"C"],[5,"B"],[6,"A"],[7,"B"],[10,"B"],[11,"C"],[12,"A"],[13,"A"],[14,"B"],[16,"B"],[17,"A"],[18,"A"],[21,"A"],[25,"B"],[27,"B"],[32,"A"],[39,"D"]], desc: "«Злой медведь с ямочками и совестью» – убиваешь за деньги, но не трогаешь слабых. Считаешь себя не заслуживающим любви. Появление Чонгука переворачивает жизнь. Путь от никчёмного убийцы до фотографа и мужа." },
    { id:"8.2", name:"Чон Чонгук", fic:"Птенчик", pairs: [[1,"A"],[2,"C"],[3,"A"],[4,"C"],[5,"G"],[6,"A"],[7,"A"],[10,"C"],[11,"D"],[12,"A"],[13,"E"],[14,"A"],[16,"B"],[17,"A"],[18,"A"],[19,"B"],[21,"A"],[25,"A"],[36,"A"],[39,"D"]], desc: "«Чёрноглазый воробей с дробовиком» – подросток, видевший смерть родителей. Зол на весь мир, отчаянно нуждаешься в любви. Путь от потерянного птенца до сильного мужчины. Тату птички – клеймо надежды." },
    { id:"8.3", name:"Ким Сокджин", fic:"Птенчик", pairs: [[1,"C"],[2,"C"],[3,"G"],[4,"G"],[5,"B"],[6,"I"],[7,"H"],[10,"D"],[12,"G"],[13,"A"],[15,"B"],[16,"B"],[18,"E"],[20,"C"],[21,"C"],[25,"B"],[27,"B"],[32,"B"],[35,"B"],[39,"E"]], desc: "«Громкая мама с принципами» – ушёл из шоу-бизнеса, создаёшь уют. Сначала осуждаешь, потом принимаешь. Даже киллеры плачут в твоих объятиях." },
    { id:"8.4", name:"Мин Юнги", fic:"Птенчик", pairs: [[1,"B"],[2,"B"],[4,"G"],[5,"B"],[6,"F"],[7,"C"],[8,"F"],[9,"A"],[11,"B"],[12,"C"],[13,"D"],[14,"B"],[16,"B"],[18,"A"],[20,"H"],[22,"B"],[25,"F"],[27,"B"],[32,"B"],[39,"H"]], desc: "«Властный хищник с разбитым сердцем» – родные отвергли из-за ориентации. Носишь костюмы, ездишь на Майбахе. Жертвуешь карьерой ради близких. Путь от хищника до счастливого мужа." },
    { id:"8.5", name:"Чон Хосок", fic:"Птенчик", pairs: [[1,"I"],[2,"A"],[3,"E"],[4,"F"],[5,"F"],[6,"B"],[7,"I"],[8,"B"],[9,"H"],[10,"H"],[12,"E"],[13,"F"],[14,"C"],[15,"E"],[18,"H"],[19,"F"],[20,"H"],[24,"F"],[33,"C"],[38,"F"]], desc: "«Франтоватый щёголь с боязнью крови» – яркий, энергичный, не можешь работать в полиции из-за вида крови. Верный друг. Тот самый, без которого сюжет бы не сдвинулся." },
    { id:"8.6", name:"Пак Чимин", fic:"Птенчик", pairs: [[1,"C"],[2,"C"],[3,"D"],[4,"D"],[5,"D"],[6,"F"],[7,"H"],[10,"H"],[12,"G"],[13,"E"],[14,"C"],[15,"I"],[16,"I"],[18,"C"],[19,"D"],[21,"E"],[25,"I"],[27,"B"],[33,"C"],[39,"H"]], desc: "«Тактильный котёнок с тайной любовью» – добрый, общительный, лазаешь по верёвочным паркам. Тайно влюблён в друга. Девиз: «обниму и помогу»." },
    { id:"8.7", name:"Ким Тэхён", fic:"Птенчик", pairs: [[1,"I"],[2,"A"],[3,"B"],[4,"F"],[5,"C"],[6,"B"],[7,"C"],[8,"H"],[9,"H"],[10,"H"],[12,"E"],[13,"F"],[14,"G"],[15,"C"],[16,"H"],[18,"H"],[19,"A"],[20,"B"],[33,"C"],[38,"H"]], desc: "«Учитель поцелуев на Рождество» – высокий, яркий, со вкусом. Учишь младших целоваться. Свободный художник, который не боится быть странным." },
    { id:"9.1.1", name:"Чон Чонгук (А)", fic:"Альтернативные мир А", pairs: [[1,"B"],[2,"C"],[3,"D"],[5,"D"],[6,"G"],[7,"C"],[10,"B"],[11,"C"],[13,"A"],[14,"B"],[16,"B"],[18,"I"],[19,"B"],[21,"A"],[22,"H"],[23,"B"],[24,"B"],[32,"A"],[39,"D"],[40,"D"]], desc: "«Замкнутый принц с чёрной кошкой» – альфа, считавший омег скучными. Видишь сны о другом мире. Путь от «не хочу ничего» до альфы, идущего за истинным." },
    { id:"9.1.2", name:"Пак Чимин (А)", fic:"Альтернативные мир А", pairs: [[1,"C"],[2,"C"],[3,"C"],[4,"B"],[5,"C"],[6,"C"],[7,"C"],[10,"B"],[12,"F"],[13,"E"],[15,"D"],[16,"E"],[18,"C"],[19,"D"],[20,"B"],[21,"C"],[25,"E"],[27,"F"],[35,"B"],[39,"H"]], desc: "«Творческая жертва токсичных отношений» – омега, боишься истинности. Встречаешь Хосока – истинного. Путь от забитого омеги до счастливой жены." },
    { id:"9.1.3", name:"Чон Хосок (А)", fic:"Альтернативные мир А", pairs: [[1,"D"],[2,"C"],[3,"A"],[4,"G"],[6,"I"],[7,"C"],[8,"B"],[10,"D"],[13,"A"],[14,"C"],[15,"C"],[16,"C"],[18,"E"],[19,"A"],[20,"H"],[23,"B"],[27,"F"],[32,"G"],[34,"H"],[39,"H"]], desc: "«Идеальный. Точка.» – золотой мальчик, фиктивные отношения. Встречаешь истинного – бросаешь бизнес ради танцев. Путь от «должен» до «хочу»." },
    { id:"9.1.4", name:"Мин Юнги (А)", fic:"Альтернативные мир А", pairs: [[1,"B"],[2,"B"],[3,"B"],[4,"G"],[5,"F"],[6,"H"],[7,"C"],[8,"G"],[10,"B"],[11,"C"],[12,"F"],[13,"D"],[14,"B"],[16,"B"],[18,"B"],[21,"A"],[27,"F"],[31,"A"],[35,"A"],[39,"H"]], desc: "«Ледяная роза» – учёный-биолог, не терпишь прикосновений. Прямолинеен и остроумен. Путь от «не доверяю» до «страстно люблю». Шипы внутри." },
    { id:"9.1.5", name:"Ким Тэхён (А)", fic:"Альтернативные мир А", pairs: [[1,"A"],[2,"A"],[3,"A"],[4,"C"],[5,"E"],[6,"B"],[7,"A"],[10,"A"],[11,"D"],[12,"A"],[13,"A"],[14,"A"],[16,"C"],[18,"B"],[19,"A"],[21,"G"],[25,"C"],[27,"F"],[36,"C"],[39,"D"]], desc: "«Альфа-травматик с аллергией на мясо» – влюблялся в альф, получил травму от омеги. Юнги становится истинным. Путь от ненавидевшего омег до обожающего." },
    { id:"9.1.6", name:"Ким Сокджин (А)", fic:"Альтернативные мир А", pairs: [[1,"C"],[2,"C"],[3,"B"],[4,"H"],[7,"D"],[9,"C"],[11,"E"],[14,"H"],[17,"C"],[17,"F"],[19,"G"],[21,"H"],[23,"G"],[24,"G"],[26,"H"],[27,"H"],[28,"G"],[29,"H"],[32,"D"],[36,"I"]], desc: "«Омега номер один» – фиктивный парень Хосока, беременеешь, он уходит. Путь от отвергнутой до любимой жены из другого мира. Рыбачишь и философствуешь." },
    { id:"9.2.1", name:"Пак Чимин (В)", fic:"Альтернативные мир В", pairs: [[1,"G"],[2,"F"],[3,"F"],[5,"I"],[6,"D"],[8,"E"],[10,"G"],[11,"I"],[13,"C"],[14,"H"],[16,"H"],[27,"I"],[29,"G"],[30,"H"],[32,"E"],[34,"B"],[35,"H"],[38,"C"],[39,"G"],[40,"G"]], desc: "«Романтик, которого предали» – бухгалтер с душой художника. Путь от жертвы обмана до человека, который выбрал себя." },
    { id:"9.2.2", name:"Чон Хосок (В)", fic:"Альтернативные мир В", pairs: [[2,"H"],[3,"H"],[4,"E"],[6,"D"],[9,"C"],[12,"C"],[13,"G"],[15,"F"],[17,"D"],[21,"E"],[26,"C"],[28,"B"],[30,"D"],[31,"H"],[32,"F"],[33,"B"],[34,"B"],[35,"C"],[38,"E"],[40,"E"]], desc: "«Жарче только Килиманджаро» – танцор, видел во снах брата. Встречаешь омегу из мира А – обретаешь равновесие. Путь от тоски по семье до главы семьи." },
    { id:"9.2.3", name:"Мин Юнги (В)", fic:"Альтернативные мир В", pairs: [[1,"F"],[2,"H"],[4,"I"],[5,"C"],[7,"A"],[7,"D"],[8,"E"],[11,"D"],[14,"C"],[15,"G"],[16,"H"],[19,"D"],[21,"F"],[25,"E"],[27,"F"],[29,"G"],[33,"E"],[34,"G"],[36,"A"],[39,"F"]], desc: "«Реставратор, сломавший реальность» – закрытый столяр. Даришь зеркало, которое соединяет миры. Путь от скрытного мастера до активного участника мультивселенной." },
    { id:"9.2.4", name:"Ким Намджун (В)", fic:"Альтернативные мир В", pairs: [[1,"E"],[2,"H"],[3,"B"],[4,"E"],[5,"G"],[6,"F"],[9,"I"],[10,"C"],[12,"C"],[13,"G"],[14,"F"],[15,"C"],[17,"C"],[20,"C"],[20,"F"],[22,"H"],[26,"H"],[28,"C"],[31,"D"],[32,"D"]], desc: "«Запутавшийся альфа, который сбежал в другой мир» – изменил партнёру, потерял всё. Меняешься душами с Чонгуком, уходишь в мир А. Путь от разрушителя до нашедшего себя." },
    { id:"9.2.5", name:"Тэхён+Сокджин (В)", fic:"Альтернативные мир В", pairs: [[2,"A"],[3,"B"],[4,"D"],[5,"H"],[8,"I"],[11,"G"],[12,"E"],[14,"E"],[16,"E"],[17,"B"],[19,"C"],[21,"C"],[22,"F"],[24,"F"],[27,"H"],[30,"G"],[33,"F"],[35,"E"],[38,"D"],[39,"C"]], desc: "«Пара, рождённая из измены» – один прямой, другой заботливый. Оба были обмануты. Встречаются и исцеляют друг друга. Если выпали они – вам нужно пережить предательство, чтобы найти настоящую любовь. Неразделимы." },
    { id:"10.1", name:"Чон Чонгук", fic:"Не отдавай меня ему", pairs: [[1,"A"],[2,"C"],[3,"A"],[4,"F"],[7,"A"],[9,"C"],[10,"I"],[11,"A"],[12,"G"],[17,"D"],[20,"E"],[21,"I"],[25,"G"],[27,"E"],[31,"F"],[32,"I"],[33,"E"],[34,"C"],[38,"C"],[40,"C"]], desc: "«Успешный саморазрушитель с больной спиной» – есть всё, но внутри – ПРЛ. Путь от идеального мужа по инерции до сломленного, который учится просить помощи." },
    { id:"10.2", name:"Ким Тэхён", fic:"Не отдавай меня ему", pairs: [[1,"G"],[2,"I"],[3,"E"],[4,"E"],[5,"H"],[6,"E"],[8,"G"],[9,"I"],[15,"E"],[16,"F"],[17,"C"],[19,"E"],[22,"D"],[23,"H"],[25,"H"],[27,"I"],[29,"G"],[30,"D"],[34,"B"],[35,"C"]], desc: "«Измотанный ангел с брендом Libertas» – забота о сыне с РАС, муж отстранился. Любишь слово «свобода», но сам в тюрьме. Учишься плавать (метафорически)." },
    { id:"10.3", name:"Пак Чимин", fic:"Не отдавай меня ему", pairs: [[2,"F"],[3,"F"],[4,"I"],[7,"D"],[8,"E"],[9,"C"],[10,"F"],[12,"E"],[13,"C"],[15,"B"],[16,"C"],[17,"B"],[18,"E"],[21,"B"],[26,"G"],[27,"A"],[32,"E"],[33,"D"],[37,"B"],[39,"F"]], desc: "«Эмпатичный волшебник с чувством вины» – гувернёр, ладишь с ребёнком с РАС. Влюбляешься в женатого, умеешь уходить вовремя. Путь от «разрушителя семей» до создателя своей семьи." },
    { id:"10.4", name:"Чон Хосок", fic:"Не отдавай меня ему", pairs: [[2,"G"],[5,"I"],[7,"I"],[9,"G"],[11,"G"],[13,"B"],[14,"H"],[17,"F"],[20,"G"],[23,"I"],[24,"H"],[27,"G"],[30,"E"],[33,"B"],[34,"C"],[35,"I"],[36,"E"],[37,"H"],[38,"E"],[39,"B"]], desc: "«Демон с нервным срывом» – семейный консультант, с которым Чонгук изменил. Путь от случайного соблазнителя до мужа и отца. Пережил крах идеальной жизни, построил настоящую." },
    { id:"10.5", name:"Ким Сокджин", fic:"Не отдавай меня ему", pairs: [[1,"D"],[2,"H"],[3,"I"],[4,"C"],[5,"H"],[7,"E"],[9,"E"],[13,"G"],[15,"F"],[16,"D"],[17,"F"],[20,"B"],[21,"D"],[22,"H"],[24,"D"],[26,"F"],[28,"F"],[32,"D"],[36,"C"],[38,"B"]], desc: "«Весёлый холостяк с неуёмным аппетитом» – лучший друг, крёстный ребёнка. Флиртуешь, наблюдателен, опора в кризис. Путь от лёгкого друга до человека, который тоже может меняться и любить." },
    { id:"10.7", name:"Юнги (утконос)", fic:"Не отдавай меня ему", pairs: [[1,"F"],[2,"H"],[3,"E"],[4,"E"],[5,"I"],[6,"E"],[7,"B"],[8,"D"],[9,"G"],[11,"E"],[12,"B"],[13,"C"],[14,"H"],[15,"C"],[18,"B"],[22,"F"],[27,"A"],[32,"F"],[34,"D"],[37,"A"]], desc: "«Рациональный ребёнок с идеальным слухом» – шестилетний аутист, называет себя утконосом. Любишь порядок, игрушки Кою и Арджея. Чувствуешь, что отец жив. Если выпал ты – ты гений, которого не понимают нейротипики. И это нормально." },
    { id:"11.1", name:"Ким Намджун", fic:"Нигредо", pairs: [[2,"G"],[3,"A"],[4,"A"],[5,"D"],[6,"E"],[7,"G"],[8,"G"],[9,"I"],[10,"I"],[13,"C"],[15,"D"],[17,"D"],[20,"E"],[21,"G"],[24,"G"],[27,"D"],[29,"B"],[32,"C"],[34,"E"],[35,"H"]], desc: "«Гипнотизёр с алхимией в душе» – манипулируешь, но заботишься. Живёшь в одиночестве и тьме после потери. Тот, кто тянет в свою тьму, но там тепло и безопасно." },
    { id:"11.2", name:"Ким Сокджин", fic:"Нигредо", pairs: [[7,"I"],[10,"G"],[11,"E"],[12,"I"],[14,"G"],[15,"G"],[17,"C"],[19,"G"],[20,"F"],[21,"E"],[24,"C"],[26,"G"],[27,"D"],[28,"G"],[30,"G"],[32,"E"],[34,"G"],[36,"B"],[39,"C"],[40,"G"]], desc: "«Клоун с травмой форта» – весельчак, переживший ужас врача в «форте». Защита – шутить, когда страшно. Исцеляющий, который сам нуждается в исцелении." },
    { id:"11.3", name:"Мин Юнги", fic:"Нигредо", pairs: [[1,"F"],[4,"B"],[5,"H"],[7,"B"],[11,"D"],[13,"B"],[16,"E"],[18,"I"],[21,"H"],[25,"E"],[27,"C"],[30,"D"],[31,"I"],[32,"F"],[33,"I"],[34,"I"],[36,"G"],[37,"G"],[39,"G"],[40,"C"]], desc: "«Волк с горячим сердцем» – хромой следователь, считает, что любовь должна жить без телесности. Удочеряет девочек, учится проявлять нежность. Путь от мёртвой любви до живого волка." },
    { id:"11.4", name:"Чон Хосок", fic:"Нигредо", pairs: [[1,"G"],[4,"E"],[6,"G"],[9,"F"],[12,"H"],[13,"D"],[14,"C"],[15,"E"],[16,"F"],[17,"I"],[21,"I"],[24,"H"],[25,"H"],[27,"D"],[29,"G"],[31,"G"],[34,"D"],[36,"H"],[39,"F"],[40,"E"]], desc: "«Тихий эксперт с ложным дном» – застенчивый ботаник, специалист по розам. Остерегайся странных заказчиков. Пройдёшь путь от тихони до смелого любовника." },
    { id:"11.5", name:"Пак Чимин", fic:"Нигредо", pairs: [[1,"A"],[2,"G"],[4,"I"],[6,"C"],[8,"G"],[11,"B"],[12,"E"],[13,"G"],[15,"B"],[16,"G"],[18,"D"],[19,"E"],[24,"B"],[26,"E"],[27,"E"],[30,"H"],[31,"H"],[33,"E"],[37,"E"],[39,"I"]], desc: "«Восточный лебедь и лиса в одном флаконе» – гениальный танцовщик, хрупкий внешне, но та ещё лисица с девятью хвостами. Прекрасно готовит и дурит головы мужчинам." },
    { id:"11.6", name:"Ким Тэхён", fic:"Нигредо", pairs: [[4,"B"],[5,"G"],[6,"G"],[8,"G"],[10,"F"],[11,"G"],[12,"G"],[13,"H"],[14,"F"],[15,"H"],[17,"B"],[19,"I"],[22,"F"],[27,"G"],[29,"E"],[32,"E"],[34,"D"],[36,"E"],[38,"C"],[39,"I"]], desc: "«Солнечный офицер с отцом-монстром» – светлый, тёплый, любимец общества. Путь от идеалиста до мудрого мужчины, который видит и свет, и тьму. Ревнивый, но всепрощающий." },
    { id:"11.7", name:"Чон Чонгук", fic:"Нигредо", pairs: [[2,"I"],[4,"A"],[6,"D"],[7,"E"],[11,"E"],[14,"C"],[15,"E"],[19,"D"],[21,"D"],[22,"G"],[23,"G"],[25,"I"],[27,"H"],[29,"I"],[30,"I"],[33,"H"],[35,"I"],[37,"H"],[39,"G"],[40,"C"]], desc: "«Барон-педант с огромным сердцем» – молодой следователь, аскет, педантичен до мании. Подавлял свою ориентацию, считая грехом. Путь от холодного аналитика до свободного любовника." }
];

        const optionsHtml = Object.entries(q.options).map(([letter, text]) => `
            <div class="option" data-letter="${letter}">
                <div class="option-letter">${letter}</div>
                <div class="option-text">${text}</div>
            </div>
        `).join('');
        const progressWidth = (currentQuestion / 40) * 100;
        document.getElementById("testArea").innerHTML = `
            <div class="progress-area">
                <div class="progress-bar-bg"><div class="progress-fill" style="width: ${progressWidth}%"></div></div>
                <div class="q-counter">${currentQuestion+1}/40</div>
            </div>
            <div class="question-card">
                <div class="question-text">${q.text}</div>
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                <div class="nav-buttons">
                    <button id="prevBtn" ${currentQuestion===0 ? 'disabled' : ''}>◀ Назад</button>
                    <button id="nextBtn" class="primary">${currentQuestion===39 ? 'Завершить' : 'Далее ▶'}</button>
                </div>
            </div>
        `;
        
        // ВЫДЕЛЕНИЕ ВЫБРАННОГО ВАРИАНТА (через класс)
        if (userAnswers[currentQuestion]) {
            const selectedDiv = document.querySelector(`.option[data-letter="${userAnswers[currentQuestion]}"]`);
            if (selectedDiv) selectedDiv.classList.add('selected');
        }
        
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', () => {
                const letter = opt.dataset.letter;
                userAnswers[currentQuestion] = letter;
                renderQuestion();
            });
        });
        document.getElementById('prevBtn')?.addEventListener('click', () => {
            if (currentQuestion > 0) { currentQuestion--; renderQuestion(); }
        });
        document.getElementById('nextBtn')?.addEventListener('click', () => {
            if (userAnswers[currentQuestion] === null) { alert("Выберите вариант ответа!"); return; }
            if (currentQuestion === 39) finishTest();
            else { currentQuestion++; renderQuestion(); }
        });
    }

    function finishTest() {
        // считаем совпадения для всех персонажей
        let scores = characters.map(ch => {
            let score = 0;
            for (let [qNum, expectedLetter] of ch.pairs) {
                if (userAnswers[qNum-1] === expectedLetter) score++;
            }
            return { ...ch, score };
        });

        // сортируем по убыванию
        scores.sort((a,b) => b.score - a.score);
        const bestMatch = scores[0];
        // следующие три (2,3,4 места)
        const top3 = scores.slice(1, 4);

        // формируем стильные карточки для топ-3
        let top3Html = '';
        if (top3.length) {
            const medals = ['🥈', '🥉', '4️⃣']; // второе, третье, четвёртое место
            top3Html = `<div class="top3-section">
                            <div class="top3-title">✨ Твои ближайшие друзья ✨</div>
                            <div class="top3-grid">`;
            for (let i = 0; i < top3.length; i++) {
                const ch = top3[i];
                top3Html += `<div class="top3-card">
                                <div class="medal">${medals[i]}</div>
                                <div class="top3-name">${ch.name}</div>
                                <div class="top3-fic">${ch.fic}</div>
                                <div class="top3-score">🎯 ${ch.score} / ${ch.pairs.length}</div>
                            </div>`;
            }
            top3Html += `</div></div>`;
        }

        // вывод результата
        document.getElementById("testArea").innerHTML = `
            <div class="result-box">
                <div class="character-name">${bestMatch.name}</div>
                <div class="character-fic">${bestMatch.fic}</div>
                <div class="character-desc">${bestMatch.desc}<br><br>✨ Совпадений: ${bestMatch.score} из ${bestMatch.pairs.length}<br>🖤 Твой внутренний персонаж найден.</div>
                ${top3Html}
                <button class="restart-btn" id="restartTest">🔁 Пройти заново</button>
            </div>
        `;
        document.getElementById("restartTest")?.addEventListener("click", () => {
            userAnswers = new Array(40).fill(null);
            currentQuestion = 0;
            renderQuestion();
        });
    }

    renderQuestion();
</script>
</body>
</html>
