        { text: "Как вы ведёте себя в компании незнакомых людей?", options: { A: "Душа компании, завожу всех.", B: "Стою в углу и молчу, меня не трогайте.", C: "Вежлив, мил, но внутри ледник.", D: "Очень стесняюсь, могу покраснеть и замолчать.", E: "Присматриваюсь, оцениваю, потом выбираю, с кем говорить.", F: "Активно знакомлюсь, но быстро устаю.", G: "Пытаюсь всем угодить, чтобы понравиться.", H: "Держусь рядом с кем-то знакомым, потом осваиваюсь.", I: "Сразу пытаюсь найти общую тему, чтобы разговорить." } },
        { text: "Что помогает вам быстрее всего прийти в себя, когда вы на пределе?", options: { A: "Громкая музыка или тишина в наушниках.", B: "Визуальная красота: живопись, закат, цветы.", C: "Процесс готовки или выпечки.", D: "Счёт до десяти или перебирание бус.", E: "Объятия и тактильный контакт.", F: "Алкоголь или лёгкие седативные.", G: "Уборка и наведение порядка.", H: "Прогулка на свежем воздухе.", I: "Медитация или дыхательные упражнения." } },
        { text: "Как вы справляетесь с ситуацией, когда вас никто не понимает?", options: { A: "Замыкаюсь и убеждаю себя, что я всегда был один.", B: "Обижаюсь и требую внимания, могу устроить сцену.", C: "Пытаюсь объяснить снова и снова, терпеливо.", D: "Ухожу в творчество или работу.", E: "Ищу хотя бы одного человека, кто поймёт, и цепляюсь за него.", F: "Плачу, но потом успокаиваюсь.", G: "Злюсь и обвиняю других в тупости.", H: "Пытаюсь добиться понимания любым способом.", I: "Принимаю как факт и иду дальше." } },
        { text: "Что для вас самое сложное в работе/учебе?", options: { A: "Дисциплина и режим.", B: "Начальники и авторитеты.", C: "Скука и рутина.", D: "Необходимость работать в команде.", E: "Стресс и выгорание, которые я прячу.", F: "Дедлайны и переработки.", G: "Конкуренция и сравнение с другими.", H: "Монотонность и отсутствие роста.", I: "Ответственность за результат." } },
        { text: "Как вы относитесь к планам на будущее?", options: { A: "Живу одним днём, планы — это иллюзия.", B: "Люблю долгосрочные планы, но боюсь их не выполнить.", C: "Составляю списки и графики, без них тревожно.", D: "Иду по течению, но с маячками.", E: "Есть одна большая мечта, а остальное — детали.", F: "Планирую, но без фанатизма, оставляю место спонтанности.", G: "Не планирую, потому что всё равно всё меняется.", H: "Обожаю строить грандиозные планы, но не всегда их выполняю.", I: "Планирую только самое важное, остальное — как пойдёт." } },
        { text: "Что вы делаете, когда просыпаетесь в плохом настроении?", options: { A: "Всем об этом сообщаю и порчу день окружающим.", B: "Молчу, пью кофе, никого не трогаю.", C: "Иду на пробежку или тренировку.", D: "Рисую или слушаю музыку.", E: "Обнимаю кота/собаку или плюшевую игрушку.", F: "Позволяю себе побыть в плохом настроении полчаса, потом беру себя в руки.", G: "Сразу берусь за работу, чтобы отвлечься.", H: "Принимаю душ и делаю ритуалы хорошего дня.", I: "Жалуюсь партнёру или другу." } },
        { text: "Как вы переживаете разрыв отношений?", options: { A: "Очень тяжело, могу впасть в депрессию с попытками суицида.", B: "Внешне спокойно, а внутри всё сгорает.", C: "Начинаю мстить или доказывать, что я лучше.", D: "Ищу утешения в работе, алкоголе или наркотиках.", E: "Плачу, но иду дальше, потому что жизнь продолжается.", F: "Долго анализирую, что пошло не так, и делаю выводы.", G: "Полностью ухожу в себя и не общаюсь ни с кем месяцами.", H: "Сразу начинаю новые отношения, чтобы заглушить боль.", I: "Ищу поддержку у друзей и семьи." } },
        { text: "Как вы относитесь к деньгам и роскоши?", options: { A: "Роскошь — это безопасность, я люблю красивые вещи.", B: "Деньги — инструмент, не более. Живу скромно.", C: "Легко трачу, люблю делать дорогие подарки близким.", D: "Боюсь бедности, коплю на чёрный день.", E: "Мне всё равно, главное — чтобы любимые были сыты.", F: "Зарабатываю много, но не умею тратить, коплю.", G: "Трачу на себя и на эмоции, не задумываясь.", H: "Считаю каждую копейку, живу экономно.", I: "Деньги для меня — способ свободы, а не самоцель." } },
        { text: "Что для вас важнее: быть любимым или понимаемым?", options: { A: "Любимым. Понимание придёт потом.", B: "Понимаемым. Любовь без понимания — пытка.", C: "И то, и другое, иначе нет смысла.", D: "Мне достаточно уважения и спокойствия.", E: "Принятие таким, какой я есть, даже если не понимают.", F: "Любимым, но не любой ценой.", G: "Понимаемым, даже без любви.", H: "Важно, чтобы ценили мои усилия.", I: "Любовь важнее, потому что понимание может появиться позже." } },
        { text: "Как вы реагируете на чужую боль?", options: { A: "Сразу бегу помогать, даже в ущерб себе.", B: "Сочувствую, но держу дистанцию, боюсь перегрузиться.", C: "Выключаю эмоции, становлюсь холодным.", D: "Плачу вместе с человеком.", E: "Ищу практическое решение: таблетку, деньги, адвоката.", F: "Стараюсь отвлечь человека разговором, не вникая глубоко.", G: "Помогаю, но только если меня попросят.", H: "Переживаю внутри, но внешне остаюсь спокойным.", I: "Злюсь на того, кто причинил боль, и пытаюсь наказать." } },
        { text: "Что вы можете назвать своим главным недостатком?", options: { A: "Иногда я слишком упрям.", B: "Бывает, что я слишком много думаю о мелочах.", C: "Иногда мне трудно быстро принимать решения.", D: "Бывает, что я слишком самокритичен.", E: "Иногда я могу быть слишком прямолинейным.", F: "Иногда мне сложно отпустить прошлые ошибки.", G: "Бывает, что я не искренен.", H: "Иногда я могу быть нетерпеливым.", I: "Иногда я слишком много анализирую ситуации." } },
        { text: "Что вы делаете, если чувствуете, что партнёр к вам охладевает?", options: { A: "Начинаю цепляться сильнее, заваливаю заботой.", B: "Ухожу первым, чтобы не бросили.", C: "Устраиваю скандал и выясняю всё до конца.", D: "Терплю и молчу, надеюсь, что пройдёт.", E: "Даю свободу, если не любит — значит, не судьба.", F: "Пытаюсь выяснить причину и исправить ситуацию.", G: "Психую, но потом беру себя в руки и предлагаю поговорить.", H: "Обращаюсь к психологу за советом.", I: "Прошу перерыв в отношениях, чтобы понять чувства." } },
        { text: "Как вы относитесь к своей сексуальности?", options: { A: "Долгое время скрывал, стыдился, теперь принимаю.", B: "Всегда было нормально, просто не афиширую.", C: "Травмирован прошлым, боюсь близости.", D: "Очень люблю, это важная часть жизни.", E: "Есть особенности, которые я долго не принимал.", F: "Спокойно, но не считаю нужным обсуждать.", G: "Изучаю себя и экспериментирую.", H: "Стыжусь, поэтому избегаю отношений.", I: "Считаю, что это личное и никого не касается." } },
        { text: "Что для вас «дом»?", options: { A: "Место, где я могу быть один и никто не трогает.", B: "Там, где мои любимые люди.", C: "Порядок, чистота, всё по полочкам.", D: "Творческий хаос: краски, глина, ноты.", E: "Дом там, где вкусно пахнет.", F: "Там, где я вырос.", G: "Место, где можно расслабиться и быть собой.", H: "Моя крепость, куда никого не пускаю.", I: "Место, где меня ждут." } },
        { text: "Как вы справляетесь с чувством одиночества?", options: { A: "Терплю, привык, иногда даже нравится.", B: "Заполняю его работой или хобби до изнеможения.", C: "Иду в гости или звоню друзьям.", D: "Плачу и чувствую себя ничтожеством.", E: "Я им наслаждаюсь.", F: "Смотрю фильмы или сериалы, чтобы заглушить тишину.", G: "Ухожу в онлайн-общение.", H: "Медитирую и пытаюсь понять себя.", I: "Отправляюсь в путешествие." } },
        { text: "Как вы ведёте себя на свидании?", options: { A: "Очаровываю, шучу, делаю комплименты.", B: "Стесняюсь, могу покраснеть и замолчать.", C: "Веду себя естественно, как в жизни.", D: "Проверяю партнёра на прочность.", E: "Устраиваю необычный сюрприз или приключение.", F: "Много говорю о себе, боюсь пауз.", G: "Предпочитаю активное свидание, а не разговоры.", H: "Тщательно готовлюсь и нервничаю.", I: "Пью алкоголь, чтобы расслабиться." } },
        { text: "Как вы относитесь к своим слабостям?", options: { A: "Скрываю их любой ценой", B: "Принимаю, но только с очень близкими.", C: "Стыжусь.", D: "Не боюсь их показывать.", E: "Боюсь, что если покажу слабость, меня используют.", F: "Скрываю, потому что не хочу обременять других.", G: "Позволяю себе быть слабым только в одиночестве.", H: "Работаю над этим с психологом.", I: "Постепенно учусь открываться." } },
        { text: "Что вы делаете, когда злитесь?", options: { A: "Могу ударить стену или сломать что-то.", B: "Сжимаю зубы и молчу, потом долго отхожу.", C: "Спорю, доказываю свою правоту.", D: "Ухожу в себя или физически удаляюсь.", E: "Рисую или пишу злые стихи.", F: "Громко кричу, могу что-то кинуть.", G: "Иду в спортзал выплеснуть агрессию.", H: "Пью успокоительное или закуриваю.", I: "Рассказываю другу, жалуюсь." } },
        { text: "Как вы переживаете неудачу?", options: { A: "Виня себя, самобичуюсь днями и ночами.", B: "Злюсь на обстоятельства или других.", C: "Анализирую ошибки, делаю выводы и иду дальше.", D: "Впадаю в апатию, могу бросить начатое.", E: "Расстраиваюсь, но быстро нахожу новую цель.", F: "Плачу, потом беру себя в руки.", G: "Ищу поддержку у близких.", H: "Пью алкоголь, чтобы забыться.", I: "Ухожу в работу с головой." } },
        { text: "Какая черта характера у других вызывает у вас восхищение?", options: { A: "Смелость и прямота.", B: "Терпение и мудрость.", C: "Нежность и забота.", D: "Способность радоваться мелочам.", E: "Ум и хладнокровие.", F: "Чувство юмора и лёгкость.", G: "Сила воли и целеустремлённость.", H: "Эмпатия и умение слушать.", I: "Честность и справедливость." } },
        { text: "Что для вас любовь?", options: { A: "Битва, в которой нужно победить сомнения.", B: "Тихая гавань, где можно отдохнуть.", C: "Одержимость и полное растворение.", D: "Риск, на который идёшь, зная, что можешь разбиться.", E: "Ежедневный труд и выбор оставаться рядом.", F: "Искра, которая может погаснуть или разгореться.", G: "Слияние душ и тел.", H: "Доверие и уважение.", I: "Желание сделать другого счастливым." } },
        { text: "Если бы вы могли загадать одно желание для себя, то какое?", options: { A: "Научиться прощать себя.", B: "Перестать бояться близости.", C: "Обрести внутреннюю свободу.", D: "Найти свой дом и семью.", E: "Стать тем, кем я есть на самом деле.", F: "Исцелиться от травм прошлого.", G: "Стать успешным и богатым.", H: "Жить долго и счастливо.", I: "Помочь всем, кого люблю." } }
    ];

const characters = [
      { id:"1.1", name:"Чон Чонгук", fic:"Не все герои носят плащи", pairs: [[1,"A"],[4,"G"],[5,"A"],[7,"A"],[11,"A"],[12,"A"],[14,"A"],[15,"A"],[16,"A"],[17,"A"],[18,"C"],[25,"A"],[29,"E"],[31,"E"],[34,"A"],[35,"A"],[36,"A"],[37,"D"],[40,"F"]], desc: "Результат теста: «Талантливый киборг»\nПсихологический портрет: Ты сначала врезаешься в стену, а потом удивляешься, откуда синяк. Упрямство у тебя вместо мозга — если решил, то хоть тресни. А трещишь ты регулярно. Честность твоя — не принцип, а баг: ты физически не успеваешь придумать ложь, пока язык не выпалил правду в лицо начальнику. В любви ты искренний, но неловкий: подаришь букет и тут же уронишь его в лужу. Суть: «сначала делаю — потом думаю, зачем». И никогда не учишься." },
    { id:"1.2", name:"Мин Юнги", fic:"Не все герои носят плащи", pairs: [[2,"B"],[3,"C"],[5,"A"],[7,"E"],[9,"A"],[10,"E"],[12,"B"],[15,"D"],[16,"B"],[18,"F"],[20,"C"],[21,"A"],[25,"D"],[26,"C"],[30,"B"],[31,"F"],[33,"B"],[35,"F"],[36,"B"]], desc: "Результат теста: «Человек-нерв»\nПсихологический портрет: Ты боишься, что тебя бросят, поэтому бросаешь первым — желательно в запое и с сигаретой. Дорогие подарки даришь, потому что не веришь, что тебя можно любить просто так. Ревнуешь как дракон, заботишься как курица-наседка. Идеальная картина: ты страдаешь в мрачной роскоши, играешь грустную музыку и ждёшь, пока кто-то скажет «хватит, иди сюда». Людей без травм боишься — кажутся подозрительно счастливыми." },
    { id:"1.3", name:"Пак Чимин", fic:"Не все герои носят плащи", pairs: [[2,"E"],[3,"B"],[6,"F"],[8,"I"],[10,"D"],[12,"F"],[13,"I"],[14,"F"],[15,"G"],[16,"C"],[18,"E"],[20,"G"],[21,"C"],[22,"I"],[23,"F"],[28,"A"],[29,"B"],[32,"B"],[35,"I"]], desc: "Результат теста: «Дай бог каждому такого брата»\nПсихологический портрет: Ты как скала, в которую бьются волны, а ей хоть бы хны. Свои проблемы решаешь в последнюю очередь, чужие — в первую. Бывший ушёл к «идеальному» парню, и ты до сих пор иногда думаешь: «А вдруг я правда не дотягиваю?». Но на деле ты единственный, кто держит всех на плаву. Если ты сказал «люблю» — это навечно, потому что ты вообще не умеешь выходить из отношений, даже из плохих. Твоя слабость: терпишь слишком долго, а потом бах — и всё." },
    { id:"1.4", name:"Ким Тэхён", fic:"Не все герои носят плащи", pairs: [[2,"B"],[4,"A"],[6,"A"],[8,"E"],[9,"B"],[10,"G"],[11,"F"],[13,"D"],[14,"G"],[16,"D"],[18,"H"],[19,"C"],[20,"A"],[22,"C"],[23,"A"],[25,"B"],[27,"E"],[34,"E"],[38,"A"]], desc: "Результат теста: «Эстет и немножечко садист»\nПсихологический портрет: Ты носишь белую шубу и пирсинг, чтобы никто не подходил близко. Твоё правило: «Я уйду первым, чтобы меня не бросили». На самом деле ты боишься, что ты невыносимый, и проверяешь людей на прочность — отойдут или нет. Можешь сделать грандиозное признание под рояль в поле, а на следующий день испугаться фразы «а давай обсудим, где будем жить». Ты слушаешь оперу и плачешь над грустными видео с собаками. Красивый, сложный и очень устал от себя." },
    { id:"1.5", name:"Чон Хосок", fic:"Не все герои носят плащи", pairs: [[1,"H"],[2,"A"],[6,"B"],[8,"H"],[14,"E"],[15,"E"],[18,"G"],[19,"G"],[21,"F"],[23,"H"],[24,"I"],[26,"E"],[27,"A"],[28,"D"],[30,"G"],[33,"I"],[34,"F"],[38,"H"],[40,"I"]], desc: "Результат теста: «Батарейка с полиаморным потенциалом»\nПсихологический портрет: Ты не выносишь одиночества — не потому, что слабый, а потому что в тишине твои мысли начинают звучать слишком громко. Поэтому ты громко смеёшься, много обнимаешься и окружаешь себя людьми. Если тебе грустно, ты не плачешь в подушку, а идёшь тусить или к кому-нибудь под бочок. Любовь для тебя — когда не один и не двое, а компания. Но внутри ты просто боишься, что если останешься один, то никто не заметит, как тебе плохо." },
    { id:"1.6", name:"Ким Намджун", fic:"Не все герои носят плащи", pairs: [[1,"E"],[2,"G"],[6,"C"],[8,"C"],[13,"C"],[14,"D"],[15,"C"],[18,"B"],[19,"E"],[20,"B"],[21,"I"],[23,"D"],[26,"I"],[28,"E"],[29,"I"],[32,"G"],[35,"B"],[39,"H"],[40,"H"]], desc: "Результат теста: «Мудрый корень»\nПсихологический портрет: Ты как старый дуб — долго раскачиваешься, зато потом не сдвинешь. Вместо того чтобы разбираться в себе, ты растишь бонсай и читаешь умные книги. Чужие проблемы решаешь быстро и чётко, свои — десять лет. Твоя суперсила: не паникуешь, когда вокруг всё рушится. Твоя суперслабость: когда всё хорошо, ты начинаешь подозревать неладное и придумывать, что ещё можно улучшить. Мудрый, но до собственного счастья доходит как черепаха." },
    { id:"1.7", name:"Ким Сокджин", fic:"Не все герои носят плащи", pairs: [[3,"I"],[6,"H"],[11,"B"],[12,"F"],[13,"F"],[14,"F"],[15,"B"],[17,"H"],[18,"H"],[19,"I"],[24,"F"],[26,"G"],[27,"C"],[28,"F"],[30,"F"],[31,"G"],[33,"G"],[37,"E"],[38,"D"]], desc: "Результат теста: «Ироничный киборг»\nПсихологический портрет: У тебя протез на ноге, но главный протез — у тебя в душе: ты заменил боль шутками. Если тебе плохо, ты пошутишь про калеку. Если страшно — пошутишь про смерть. Ты единственный, кто не ныл, а ржал. Проблема в том, что из-за твоего юмора никто не верит, что тебе нужна помощь. «Смеюсь, значит, живу» — это твой девиз. И это работает, но иногда хочется, чтобы кто-то понял, что за смехом ты прячешь настоящую боль." },
    { id:"2.1", name:"Чон Чонгук (Хаттори)", fic:"Великая сила искусства", pairs: [[2,"C"],[4,"D"],[5,"C"],[6,"I"],[8,"D"],[9,"E"],[11,"C"],[12,"D"],[14,"B"],[17,"G"],[18,"A"],[21,"D"],[25,"G"],[26,"A"],[30,"C"],[32,"H"],[35,"E"],[36,"G"],[39,"B"]], desc: "Результат теста: «Самурай с татуировками»\nПсихологический портрет: Ты носишь чёрное, длинные волосы и таинственный псевдоним, потому что «старый я умер». Но старый я просто обиделся и сидит внутри. Ты любишь всё контролировать — от кофе до того, кто на кого посмотрел. На деле ты — нежный стеклодув, который делает украшения и плачет в мастерской, когда никто не видит. Если ты моешь посуду, это не мытьё, а глубокий духовный ритуал. Женитьба для тебя — не бумажка, а произведение искусства. Серьёзно, ты даже ссоры превращаешь в эксклюзивное ювелирное изделие." },
    { id:"2.2", name:"Пак Чимин", fic:"Великая сила искусства", pairs: [[3,"G"],[4,"F"],[5,"D"],[7,"B"],[8,"A"],[13,"G"],[20,"D"],[22,"E"],[29,"D"],[30,"A"],[31,"A"],[32,"C"],[33,"A"],[34,"H"],[35,"G"],[36,"D"],[37,"A"],[39,"C"],[40,"A"]], desc: "Результат теста: «Тиран, который крякает»\nПсихологический портрет: У тебя всё разложено по полочкам: носки по цветам, мысли по папкам, жизнь по минутам. Когда тебе хорошо, ты крякаешь. Да-да, как утка. Серьёзно. Это потому, что раньше ты так боялся своего прошлого, что чуть не застрелился, а теперь компенсируешь утками. В кризис ты можешь порезать себя — но потом приготовить идеальный завтрак. У тебя режим: либо идеальный порядок, либо самоуничтожение. Третьего не дано. Учишься у других тому, что можно просто жить, а не взлетать или падать." },
    { id:"2.3", name:"Мин Юнги", fic:"Великая сила искусства", pairs: [[2,"D"],[4,"B"],[6,"E"],[7,"F"],[8,"A"],[9,"D"],[10,"F"],[11,"I"],[15,"I"],[16,"I"],[17,"E"],[18,"I"],[20,"E"],[22,"B"],[23,"E"],[24,"B"],[26,"D"],[27,"G"],[28,"C"]], desc: "Результат теста: «Лис, инсценировавший свою смерть»\nПсихологический портрет: Ты гениально подделываешь документы и делаешь взрывчатку, но боишься обнять человека — вдруг испачкаешь его своей тьмой. Голоса в голове твердят: «Ты недостоин». Ты настолько боишься близости, что предпочёл бы официально умереть, чем признаться в любви. Но когда влюбляешься, то даришь уток и пишешь стихи на теле — потому что слова застревают в горле. Твой голос гипнотический, и это единственное, чем ты гордишься без стеснения." },
     { id:"2.4", name:"Ким Тэхён", fic:"Великая сила искусства", pairs: [[10,"H"],[13,"H"],[19,"F"],[22,"F"],[23,"I"],[24,"D"],[27,"F"],[28,"H"],[30,"I"],[31,"D"],[32,"I"],[33,"I"],[34,"G"],[35,"D"],[36,"C"],[37,"C"],[38,"I"],[39,"I"],[40,"H"]], desc: "Результат теста: «Гроза преступников с саксофоном»\nПсихологический портрет: Ты потерял родителей рано и с тех пор притворяешься вечным солнышком. Обнимаешь всех подряд, говоришь «я люблю» каждому встречному, садишься на колени к друзьям. Но это маска. На самом деле ты — надёжная скала, просто спрятанная за лёгкостью. Ты боишься, что если покажешь, какой ты серьёзный внутри, люди испугаются. Твой главный минус — ты слишком хорошо притворяешься беззаботным, и никто не догадывается, что именно ты тащишь всех на своём горбу." },
    { id:"2.5", name:"Ким Намджун", fic:"Великая сила искусства", pairs: [[5,"B"],[6,"G"],[7,"F"],[8,"A"],[12,"F"],[13,"I"],[14,"F"],[16,"F"],[17,"H"],[18,"D"],[19,"H"],[21,"B"],[22,"H"],[23,"C"],[26,"B"],[28,"H"],[32,"B"],[39,"E"],[40,"I"]], desc: "Результат теста: «Умный папа с ямочками на щеках»\nПсихологический портрет: Ты знаешь шесть языков, но слово «люблю» выучил только в сорок лет. После развода ты решил, что любовь — это не твоё, зато папство — твоё. Ты ужасно поёшь, но это никого не волнует, потому что твои объятия лечат лучше песни. Твоя проблема: ты долго отрицаешь, что тебе кто-то нужен. Ты собираешь вокруг себя людей как папа, а как мужчина боишься шагнуть. Зато в твоей комнате всегда уютно и пахнет лимоном." },
    { id:"2.6", name:"Ким Сокджин", fic:"Великая сила искусства", pairs: [[1,"B"],[6,"F"],[7,"H"],[8,"F"],[13,"E"],[14,"E"],[15,"H"],[17,"A"],[18,"G"],[19,"C"],[20,"B"],[26,"A"],[27,"I"],[28,"E"],[29,"F"],[35,"F"],[38,"B"],[39,"B"],[40,"F"]], desc: "Результат теста: «Бриллиант с травмой Лаоса»\nПсихологический портрет: Ты выглядишь как дорогая статуя — элегантный, сдержанный, любишь клубнику. Но внутри — человек, который ненавидит японский язык, потому что в детском лагере его ассоциировали с плохим. Ты умеешь стрелять без промаха, но выбираешь чай и беседы. Твоя главная беда: ты не веришь, что заслуживаешь счастья. Поэтому сначала отталкиваешь, а потом сдаёшься. Твоя философия: красота спасёт мир, но сначала она должна спасти тебя." },
    { id:"2.7", name:"Чон Хосок", fic:"Великая сила искусства", pairs: [[3,"H"],[5,"E"],[6,"B"],[8,"H"],[9,"A"],[11,"D"],[12,"D"],[14,"A"],[18,"F"],[19,"A"],[24,"I"],[25,"D"],[26,"C"],[33,"C"],[34,"I"],[36,"F"],[37,"H"],[39,"F"],[40,"H"]], desc: "Результат теста: «Плейбой с английскими ирисками»\nПсихологический портрет: Ты яркий, лёгкий, красивый. У тебя были романы, неразделёнки, приключения. Твоя проблема: ты слишком быстрый. Сначала прыгаешь, потом думаешь. Однажды ты прыгнул под пулю — и это тебя остановило. Ты очень ранимый, хотя кажешься весёлым. Твой путь: от «сердцееда» до «разбитого сердца», а потом до «сердца семьи». И да, ты всё ещё классно танцуешь. Это не лечится." },
   { id:"3.1", name:"Чон Хосок", fic:"Солнечная улыбка убийцы", pairs: [[3,"C"],[4,"B"],[9,"H"],[12,"A"],[16,"B"],[17,"A"],[21,"A"],[24,"E"],[25,"G"],[27,"E"],[28,"D"],[29,"D"],[31,"C"],[32,"A"],[33,"D"],[35,"F"],[36,"B"],[37,"D"],[40,"F"]], desc: "Результат теста: «Сломленный солнечный зайчик»\nПсихологический портрет: Ты взял на себя чужую вину, потому что считал себя тряпкой, недостойной жить. В тюрьме ты шил игрушки и писал сказки, пока тебя били. Твой способ выжить — убежать в голову, в свой зоопарк, где живут милые звери. Ты чувствуешь себя виноватым даже за то, что дышишь. Твоя странная суперсила: ты можешь любить тех, кто тебя мучает, потому что «они же тоже люди». На самом деле тебе просто страшно признать, что ты не виноват. А потом — о чудо! — оказывается, что ты действительно не виноват. И мир переворачивается." },
    { id:"3.2", name:"Ким Тэхён", fic:"Солнечная улыбка убийцы", pairs: [[1,"I"],[2,"E"],[3,"D"],[5,"G"],[10,"E"],[17,"G"],[19,"B"],[20,"D"],[21,"F"],[24,"D"],[25,"B"],[27,"B"],[28,"B"],[31,"C"],[32,"H"],[34,"H"],[35,"G"],[36,"D"],[40,"B"]], desc: "Результат теста: «Хриплый ангел со счётом до десяти»\nПсихологический портрет: Ты боишься прикосновений взрослых мужчин — не потому, что капризный, а потому что тело помнит то, что мозг пытается забыть. У тебя сорван голос от крика, который никто не услышал. Ты считаешь браслеты или кусочки ткани, чтобы не сойти с ума. Но ты — удивительный: ты боишься, но идёшь. Сначала разрешаешь себя обнять, потом поцеловать, потом… Вся твоя жизнь — это маленькая победа над страхом каждый день. В конце ты становишься художником, а не жертвой. Потому что смог." },
    { id:"3.3", name:"Ким Сокджин", fic:"Солнечная улыбка убийцы", pairs: [[1,"B"],[6,"I"],[7,"C"],[12,"I"],[14,"F"],[16,"A"],[17,"H"],[18,"E"],[19,"F"],[22,"E"],[24,"H"],[26,"A"],[28,"C"],[29,"B"],[30,"F"],[32,"B"],[35,"F"],[38,"G"],[40,"I"]], desc: "Результат теста: «Гиперопекающий краш»\nПсихологический портрет: Ты отказался от личной жизни ради брата. Ты пьёшь ромашковый чай, смотришь модные журналы и выглядишь как модель. А внутри — выгоревшая батарейка. Ты контролируешь всё, что касается Тэхёна: кто к нему подходит, что говорит, как смотрит. Потому что если ты перестанешь контролировать, случится что-то страшное — так тебе кажется. Твоя задача: научиться не быть надзирателем, а быть просто братом. И позволить кому-то позаботиться о тебе самом. Это сложнее, чем выглядит." },
    { id:"3.4", name:"Мин Юнги", fic:"Солнечная улыбка убийцы", pairs: [[3,"B"],[4,"D"],[6,"C"],[7,"C"],[8,"B"],[11,"C"],[13,"I"],[14,"D"],[17,"H"],[18,"A"],[19,"E"],[22,"I"],[24,"B"],[26,"B"],[28,"E"],[29,"B"],[32,"C"],[36,"B"],[37,"C"]], desc: "Результат теста: «Молчаливый детектив с кофе и ремонтом»\nПсихологический портрет: Ты выражаешь любовь через ремонт и расследования. Не умеешь говорить «я скучал» — зато можешь починить кран. С первого взгляда замечаешь, что у человека болит — физически или душевно. По утрам ты злой, как собака, и без кофе ты не человек, а овощ. Но если ты взялся за дело или за человека — доведёшь до конца. Ты надёжный, как старый шкаф. Не модный, но в него можно положить всё, что дорого." },
    { id:"3.5", name:"Пак Чимин", fic:"Солнечная улыбка убийцы", pairs: [[2,"A"],[3,"A"],[5,"B"],[6,"F"],[8,"I"],[10,"A"],[13,"F"],[14,"E"],[15,"H"],[19,"I"],[21,"D"],[22,"C"],[23,"A"],[25,"E"],[27,"C"],[28,"A"],[29,"E"],[33,"G"],[34,"A"]], desc: "Результат теста: «Тактильный тайный порнописатель»\nПсихологический портрет: Ты пережил рак и с тех пор обнимаешь всех, потому что знаешь: жизнь коротка. Ты катаешься на лонгборде в белом, крякаешь и лезешь с объятиями даже к тем, кто не хочет. Твоя тайна: ты пишешь горячие романы и жутко стесняешься. Ты лезешь в душу к людям не потому, что ты нахал, а потому что умеешь ждать и чувствовать, когда можно. Твоё правило: «Жизнь коротка, обниму сейчас». И это удивительно работает." },
    { id:"3.6", name:"Ким Намджун", fic:"Солнечная улыбка убийцы", pairs: [[4,"G"],[6,"A"],[11,"B"],[13,"E"],[14,"B"],[16,"G"],[18,"G"],[20,"I"],[21,"B"],[23,"D"],[25,"F"],[26,"I"],[27,"B"],[28,"I"],[32,"I"],[33,"A"],[35,"B"],[38,"D"],[40,"D"]], desc: "Результат теста: «Заботливый медведь с ямочками и тату 707»\nПсихологический портрет: Ты сидишь в тюрьме за то, что защищался, и даже не жалуешься. Скучаешь по дочери. В тюрьме ты стал «папой» для тех, кто слабее: учишь драться, договариваться, не сдаваться. Ты не кричишь, ты действуешь. Когда выходишь — строишь дом для всех, кого любишь. Говоришь мало, но если сказал «я тебя люблю» — это навсегда, не отмажешься. Твои ямочки на щеках — это единственное, что выдаёт в тебе не убийцу, а добряка." },
    { id:"4.1", name:"Ким Намджун", fic:"Дракона подавать холодным", pairs: [[2,"B"],[4,"D"],[5,"F"],[6,"A"],[7,"B"],[8,"A"],[11,"C"],[12,"A"],[13,"I"],[14,"D"],[16,"E"],[20,"D"],[21,"A"],[26,"B"],[28,"C"],[32,"H"],[35,"A"],[36,"B"],[40,"A"]], desc: "Результат теста: «Аскетичный вулкан с чувством вины»\nПсихологический портрет: Ты сбежал от криминального прошлого и теперь выращиваешь овощи и управляешь рестораном. Ты контролируешь всё — кроме своих эмоций. Когда злишься, то напоминаешь вулкан: снаружи тихо, внутри лава. Ты думаешь, что ты чудовище, поэтому живёшь бедно и сурово, чтобы наказать себя. Когда кто-то в тебя влюбляется, ты ломаешься: «Как? Я же дракон!». Потом оказывается, что дракон — это просто кот с огнём внутри. Который всё ещё может убить, но предпочитает не надо." },
    { id:"4.2", name:"Ким Сокджин", fic:"Дракона подавать холодным", pairs: [[2,"I"],[4,"D"],[5,"A"],[6,"I"],[10,"E"],[12,"F"],[14,"G"],[15,"G"],[16,"A"],[18,"A"],[19,"C"],[20,"C"],[22,"E"],[23,"B"],[27,"B"],[28,"A"],[30,"F"],[37,"I"],[40,"A"]], desc: "Результат теста: «Ледяная маска с кипящим внутри рагу»\nПсихологический портрет: У тебя лицо как ледяная маска — спокойное, красивое, ничего не выражает. А внутри всё кипит: рагу, эмоции, страхи. Ты строишь ресторан мечты своей мамы, но сама мечта иногда пугает. Ты боишься доверять людям, потому что в прошлом тебя обжигали. Но если уж доверился — то навсегда. Ты режешь лук и плачешь, но клянёшься, что это от лука. Все знают, что нет. Но никто не спрашивает." },
     { id:"4.3", name:"Ким Тэхён", fic:"Дракона подавать холодным", pairs: [[1,"H"],[2,"E"],[4,"C"],[5,"E"],[7,"A"],[8,"D"],[10,"C"],[14,"E"],[16,"B"],[17,"B"],[18,"H"],[22,"A"],[24,"A"],[30,"C"],[35,"A"],[36,"F"],[37,"D"],[38,"A"],[40,"B"]], desc: "Результат теста: «Та ещё ведьма»\nПсихологический портрет: Ты не стал актёром, но драму играешь каждый день. Ты ревнивый, вспыльчивый, можешь быть колючим. Но внутри — мягкий и поющий. Твоя тактика: ударь первым, чтобы не ударили тебя. Ты боишься показать, что тебе больно, поэтому сначала ссоришься, а потом плачешь в подушку. Красивый до безобразия, но это не счастье, а проклятие: тебя любят за лицо, а тебе хочется, чтобы за душу." },
    { id:"4.4", name:"Чон Чонгук", fic:"Дракона подавать холодным", pairs: [[2,"E"],[6,"H"],[8,"B"],[9,"B"],[11,"F"],[13,"D"],[15,"D"],[18,"D"],[21,"E"],[23,"C"],[25,"C"],[26,"E"],[29,"A"],[31,"B"],[33,"F"],[34,"D"],[36,"E"],[38,"B"],[39,"C"]], desc: "Результат теста: «Верующий упрямец с внутренним грехом»\nПсихологический портрет: У тебя Бог и любовь к Тэхёну воюют за твою душу. Ты аккуратист, ответственный, когда нервничаешь — болит голова. Ты считаешь, что любить мужчину — грех, но не можешь без этого. Особенно если этого «греха» зовут Тэхёном. Твой путь — от «правильного католика» до «счастливого грешника», который понял, что Бог — это любовь, а не список запретов. Ты самый драматичный борец с самим собой. И лучший повар по мясу." },
    { id:"4.5", name:"Мин Юнги", fic:"Дракона подавать холодным", pairs: [[2,"D"],[5,"C"],[7,"E"],[9,"F"],[10,"B"],[12,"B"],[13,"A"],[14,"I"],[16,"D"],[19,"H"],[21,"G"],[24,"C"],[25,"F"],[27,"D"],[31,"E"],[32,"A"],[33,"H"],[37,"F"],[38,"G"]], desc: "Результат теста: «Циничный мститель с глубокой раной»\nПсихологический портрет: Ты приехал на край света, чтобы отравить Намджуна (который оказался твоим братом, о чём ты не знал). Ты мрачный, уставший, циничный. На деле — глубокий романтик, который просто боится этого показывать. Твоя защита: ненавидеть, чтобы не плакать. Когда узнаёшь правду, ломаешься. Но потом встречаешь людей, которые не дают тебе рассыпаться. Твой путь: от «я отомщу» до «я люблю и принимаю». Самый тёмный, но самый светлый в конце." },
    { id:"4.6", name:"Пак Чимин", fic:"Дракона подавать холодным", pairs: [[1,"E"],[4,"D"],[5,"A"],[8,"G"],[12,"H"],[14,"A"],[15,"F"],[17,"I"],[19,"D"],[20,"G"],[22,"C"],[24,"E"],[26,"F"],[28,"C"],[31,"B"],[34,"C"],[35,"E"],[37,"I"],[40,"C"]], desc: "Результат теста: «Немой, но талантливый»\nПсихологический портрет: Ты не говоришь из-за травмы в детстве, но мурлычешь, когда тебя гладят. Объясняешься жестами, записками и взглядом. Ты гениальный кондитер и ужасно застенчивый. В любви ты начинаешь говорить — сначала слово, потом фразу. С каждым разом всё больше. Ты — доказательство, что иногда без слов можно сказать больше, чем с ними. А когда ты мурлычешь — все тают, даже суровые парни." },
    { id:"4.7", name:"Чон Хосок", fic:"Дракона подавать холодным", pairs: [[2,"A"],[3,"G"],[4,"D"],[5,"E"],[6,"B"],[9,"D"],[11,"A"],[14,"A"],[18,"F"],[19,"A"],[23,"E"],[24,"I"],[25,"D"],[27,"F"],[30,"B"],[33,"C"],[34,"A"],[36,"F"],[39,"A"]], desc: "Результат теста: «Энерджайзер с грядками»\nПсихологический портрет: Ты делаешь лучший кофе и выращиваешь травы. Ты любишь обниматься и говорить о чувствах первым. Твоя проблема: ты боялся остаться один, потому что друг ушёл. Но ты решился на откровенные разговоры — и создал семью. Ты как садовник: сажаешь, поливаешь и ждёшь, пока расцветут самые колючие кактусы. У тебя нет больших травм — ты сам лекарство. Но иногда лекарству тоже нужен выходной." },
    { id:"5.1", name:"Чон Чонгук", fic:"О праведное пламя!", pairs: [[2,"E"],[6,"D"],[9,"G"],[10,"H"],[12,"B"],[15,"A"],[17,"E"],[19,"F"],[21,"B"],[23,"C"],[25,"H"],[26,"D"],[28,"F"],[31,"E"],[32,"G"],[35,"C"],[37,"B"],[38,"D"],[40,"A"]], desc: "Результат теста: «Булка под маской генерала»\nПсихологический портрет: Тебя научили только воевать. Эмоции для тебя — как иностранный язык, который ты не учил. Ты не понимаешь, что чувствуешь, поэтому сначала делаешь, а потом понимаешь: «А, это была любовь». Или «А, это была злость». Ты равнодушен к жене, потому что не знаешь, как её любить. Тебе страшны не пули и не огонь — страшны чувства. Хосок становится твоим учителем жизни: он показывает, что такое ревность, нежность, привязанность. Ты учишься как робот — по шагам. Но к концу получается почти человек." },
    { id:"5.2", name:"Чон Хосок", fic:"О праведное пламя!", pairs: [[1,"F"],[3,"A"],[7,"G"],[8,"C"],[11,"H"],[12,"D"],[14,"A"],[16,"B"],[18,"F"],[20,"A"],[22,"G"],[24,"E"],[27,"C"],[29,"F"],[30,"E"],[33,"C"],[34,"A"],[36,"F"],[39,"B"]], desc: "Результат теста: «Сломленная, но горящая святыня»\nПсихологический портрет: Ты прошёл рабство и насилие, но остался «солнечным». Как? Непонятно. Чудо. Ты умеешь прощать и доверять — это в твоей ситуации просто сверхспособность. Твоя мягкость — на самом деле сила: агрессоры теряются, когда ты не боишься. Твоя главная задача — научиться не только принимать, но и говорить «нет». В конце ты становишься хранителем домашнего очага и отцом. И если кто-то тронет твою семью, ты можешь поджечь его взглядом. Серьёзно, у тебя это получится." },
    { id:"5.3", name:"Ким Намджун", fic:"О праведное пламя!", pairs: [[5,"D"],[7,"B"],[9,"B"],[11,"C"],[13,"E"],[14,"D"],[16,"G"],[18,"G"],[20,"I"],[21,"C"],[23,"F"],[26,"B"],[28,"I"],[30,"A"],[32,"H"],[33,"A"],[35,"B"],[39,"E"],[40,"D"]], desc: "Результат теста: «Мудрый миротворец с палочкой»\nПсихологический портрет: Ты никогда не проигрываешь в настольные игры, потому что просчитываешь всё на десять ходов вперёд. Хромаешь, но не жалуешься. Твоя роль — «папа» для всех сумасшедших, которые тебя окружают. Ты пишешь стихи и умеешь успокаивать бурю одним видом. Твоя любовь тихая, без криков и разбитых тарелок. Ты готов отказаться от карьеры ради семьи. Рядом с тобой все успокаиваются, потому что ты сам — спокойствие. Даже когда внутри ураган." },
    { id:"5.4", name:"Ким Сокджин", fic:"О праведное пламя!", pairs: [[1,"D"],[6,"I"],[7,"F"],[10,"E"],[12,"C"],[15,"H"],[16,"A"],[17,"B"],[20,"F"],[22,"E"],[24,"I"],[26,"A"],[29,"C"],[30,"F"],[32,"B"],[35,"F"],[36,"D"],[38,"G"],[40,"I"]], desc: "Результат теста: «Красивый манипулятор с травмой»\nПсихологический портрет: Ты потерял жену и сына в огне. После этого стал холодным и безжалостным. Носишь маску вежливого царедворца, а внутри — пепел. Ты ненавидишь огонь, потому что он забрал твоих близких. Ты умеешь говорить красивые сказки и петь — чтобы усыпить чужую бдительность. Ты видишь людей насквозь. Ради Намджуна ты бросаешь всё. Твой путь: от «машины» до счастливого мужа, который всё ещё боится огня, но греется у чужого тепла." },
    { id:"5.5", name:"Мин Юнги", fic:"О праведное пламя!", pairs: [[2,"D"],[3,"F"],[8,"C"],[9,"E"],[11,"H"],[12,"G"],[14,"I"],[15,"A"],[17,"D"],[19,"F"],[22,"B"],[24,"C"],[25,"E"],[28,"H"],[31,"D"],[32,"A"],[33,"G"],[37,"C"],[38,"F"]], desc: "Результат теста: «Безумный цветовод с нитями судеб»\nПсихологический портрет: Ты видишь будущее и живёшь с проклятием: в вашей семье все сходят с ума. Ты носишь белое, выращиваешь цветы в оранжерее и говоришь загадками. Ты устал и одинок. Твоя защита: цинизм и отстранённость. Тэхён лечит тебя — не лекарствами, а своей странной добротой. Вы вместе уходите из дворца и находите счастье в семье и творчестве. Твой путь: от «проклятого пророка» до «свободного художника», который больше не боится сойти с ума, потому что есть ради кого оставаться вменяемым." },
    { id:"5.6", name:"Ким Тэхён", fic:"О праведное пламя!", pairs: [[1,"H"],[2,"E"],[5,"E"],[8,"D"],[10,"C"],[13,"B"],[14,"E"],[17,"G"],[19,"B"],[21,"F"],[24,"A"],[25,"C"],[27,"B"],[30,"C"],[31,"A"],[34,"F"],[35,"A"],[36,"D"],[40,"B"]], desc: "Результат теста: «Ребёнок-феникс в красном»\nПсихологический портрет: Ты 20 лет просидел в заточении, но вышел оттуда любопытным, добрым и свободным. Это вообще как? Необъяснимо. Ты боишься белого (цвет тюрьмы) и любишь красное. Ты не умеешь врать, говоришь разными голосами и хочешь рисовать всё на свете. У тебя нет снов — ты никогда их не видел, и мечтаешь их увидеть. Ты — живое чудо. Ты не знаешь злобы, хотя имеешь полное право. Твоя философия: «Свобода — это когда можно рисовать даже на стенах». И тебя никто не останавливает." },
    { id:"5.7", name:"Пак Чимин", fic:"О праведное пламя!", pairs: [[1,"E"],[2,"A"],[5,"B"],[8,"F"],[10,"A"],[12,"H"],[13,"F"],[14,"E"],[15,"H"],[18,"C"],[19,"D"],[21,"D"],[22,"C"],[26,"F"],[29,"C"],[31,"B"],[34,"A"],[35,"E"],[38,"I"]], desc: "Результат теста: «Хрупкий тростник, который не ломается»\nПсихологический портрет: Тебя продали в рабство, но ты сохранил нежность и талант. Ты играешь на флейте и поёшь. Ты безответно влюблён в Хосока, но отпускаешь его — потому что любишь по-настоящему. Потом ты становишься странствующим лекарем. Ты хрупкий с виду, но сломать тебя нельзя — ты гнёшься, но не ломаешься. Ты умеешь ухаживать за волосами и лечить травами. В конце ты возвращаешься к семье уже не как слуга, а как равный. Потому что заслужил." },
    { id:"6.1", name:"Ким Тэхён", fic:"Танец с невидимым врагом", pairs: [[1,"I"],[4,"C"],[5,"G"],[8,"D"],[10,"C"],[12,"B"],[14,"E"],[16,"D"],[17,"G"],[19,"B"],[21,"F"],[24,"A"],[25,"B"],[27,"B"],[31,"E"],[32,"H"],[34,"F"],[36,"D"],[40,"B"]], desc: "Результат теста: «Умирающий лев с пистолетом на могиле»\nПсихологический портрет: Тебе 50, ты богат и успешен, но болен наследственной болезнью, которая убила твоего отца. Ты циничный, не веришь в искренность и готовишься к смерти — у тебя даже пистолет припасён на могилу. Твоя защита: контроль и одиночество. «Зачем любить, если я умру?» — думаешь ты. Но приходит молодой наглец с планом мести и случайно влюбляет тебя. Твой путь: от «я должен страдать» до «я имею право жить и любить». Ты учишься бороться с болезнью и убираешь пистолет. Стареющий, но не сдающийся." },
     { id:"6.2", name:"Чон Хосок", fic:"Танец с невидимым врагом", pairs: [[3,"A"],[6,"B"],[8,"H"],[9,"D"],[11,"A"],[13,"F"],[14,"A"],[18,"F"],[19,"A"],[22,"G"],[23,"E"],[24,"E"],[26,"D"],[27,"F"],[30,"B"],[33,"C"],[34,"A"],[36,"F"],[39,"A"]], desc: "Результат теста: «Молодой наглец с тату бабочки»\nПсихологический портрет: Ты с детства вырезал фото Тэхёна из журналов, чтобы возненавидеть его. Ты идёшь в его компанию, чтобы разорить и уничтожить. Но встречаешь живого — и всё рушится. Ты не умеешь притворяться в чувствах. Твоя месть превращается в любовь. Ты признаёшься, что хотел сделать больно, но не можешь. Ты не умеешь плавать и боишься воды, но готов нырнуть в отношения с Тэхёном. Твой путь: от «похитителя покоя» до «спасательного круга». И тату бабочки теперь не месть, а надежда." },
    { id:"7.1", name:"Ким Тэхён", fic:"Последнее желание", pairs: [[1,"H"],[4,"C"],[5,"E"],[8,"D"],[10,"C"],[13,"B"],[14,"E"],[16,"B"],[17,"B"],[18,"H"],[19,"B"],[22,"A"],[24,"A"],[30,"C"],[34,"F"],[35,"A"],[36,"F"],[38,"A"],[40,"B"]], desc: "Результат теста: «Эмоциональная губка с тревожностью»\nПсихологический портрет: Ты пережил расставание и смерть друга. Чтобы не умереть от тоски, ты ведёшь «Блокнот желаний» — список того, ради чего стоит жить. Ты быстро привязываешься, остро чувствуешь чужую боль, видишь мир в картинках. Твоя защита: творчество и списки. Боишься повторения боли. Но ты находишь Юнги и становишься его сиделкой и любовью. Твой путь: от «страха нового» до «смелого мужа», который умеет поддерживать, даже когда сам трясётся." },
    { id:"7.2", name:"Мин Юнги", fic:"Последнее желание", pairs: [[2,"D"],[3,"G"],[5,"C"],[8,"C"],[9,"F"],[11,"H"],[12,"B"],[14,"I"],[19,"H"],[22,"B"],[24,"C"],[25,"F"],[27,"D"],[31,"E"],[32,"A"],[33,"H"],[35,"D"],[37,"F"],[38,"G"]], desc: "Результат теста: «Отстранённый романтик со шрамом»\nПсихологический портрет: Ты не чувствуешь желаний и готовишься умереть от больного сердца. Педантичный, внешне спокойный, но внутри ранимый до ужаса. Твоя защита: интроверсия и цинизм. Тэхён своим блокнотом вытаскивает тебя в жизнь. Ты начинаешь бороться за жизнь — ради него. Больше всего боишься стать обузой. Но учишься просить о помощи. Даришь кольца на фестивале. Твой путь: от «живого трупа» до «отчаянно живого». Просто чудак с карандашом разбудил в тебе страсть." },
    { id:"7.3", name:"Чон Хосок", fic:"Последнее желание", pairs: [[1,"F"],[2,"A"],[5,"E"],[7,"G"],[8,"C"],[11,"H"],[12,"D"],[14,"A"],[18,"F"],[20,"A"],[22,"G"],[24,"E"],[27,"C"],[29,"F"],[30,"E"],[33,"F"],[34,"A"],[36,"H"],[39,"B"]], desc: "Результат теста: «Наседка с графиком»\nПсихологический портрет: Ты живёшь по расписанию, чтобы контролировать тревогу. Убираешь, готовишь, заботишься. Разочарован в отношениях с девушками, но с Чонгуком ты учишься отпускать контроль. Твой путь: от «организатора быта» до «чувственного мужчины». Ты всё ещё заботишься через еду, но теперь добавляешь поцелуи." },
    { id:"7.4", name:"Чон Чонгук", fic:"Последнее желание", pairs: [[1,"C"],[3,"E"],[6,"H"],[8,"B"],[9,"D"],[11,"F"],[13,"D"],[15,"D"],[18,"D"],[21,"E"],[23,"C"],[25,"C"],[26,"E"],[29,"A"],[33,"E"],[34,"F"],[36,"E"],[37,"G"],[38,"B"]], desc: "Результат теста: «Энергичный жаворонок с травмой утраты»\nПсихологический портрет: Ты сбежал в другой город от боли потери матери. Ты звукорежиссёр, полон энергии, но внутри кризис. Ты тактильный, прямолинейный, язвительный в шутках. Твоя защита: постоянно двигаться и заботиться о других. Влюбляешься в Хосока и учишься быть «ведомым» в постели — для тебя это подвиг, потому что ты привык всё контролировать. Твой путь: от «ребёнка, которому нужна опора» до «опоры для всей семьи». Кормишь, обнимаешь и говоришь «всё будет хорошо», даже когда сам плачешь." },
    { id:"7.5", name:"Ким Намджун", fic:"Последнее желание", pairs: [[1,"E"],[2,"C"],[3,"C"],[4,"G"],[5,"B"],[6,"C"],[7,"C"],[8,"C"],[10,"B"],[12,"F"],[13,"A"],[14,"B"],[15,"C"],[16,"E"],[18,"G"],[21,"C"],[32,"I"],[35,"B"],[39,"H"]], desc: "Результат теста: «Вечные хризантемы не вянут»\nПсихологический портрет: Ты разучился чувствовать через объектив фотоаппарата. Ты профессионал, но внутри — пустота. Сожалеешь о прошлой связи с Сокджином: было только тело, не душа. Новая встреча — это шанс. Твоя мудрость: «Давай просто узнаем друг друга получше, без спешки». Ты учишься не физической, а душевной близости. Твой путь: от «ремесленника» до «художника», который снова видит красоту. Теперь ты смотришь в глаза, а не на тело." },
    { id:"7.6", name:"Ким Сокджин", fic:"Последнее желание", pairs: [[1,"C"],[2,"C"],[3,"G"],[4,"G"],[5,"I"],[6,"C"],[7,"C"],[10,"B"],[11,"B"],[12,"B"],[13,"E"],[15,"I"],[16,"I"],[18,"C"],[19,"C"],[21,"A"],[25,"F"],[27,"B"],[39,"E"]], desc: "Результат теста: «Талантливый донор»\nПсихологический портрет: Ты делаешь керамику и скрываешь печаль. Ты добрый до самопожертвования. Твоя травма — прошлые отношения с Намджуном, который не дал тебе души. Вы встречаетесь снова. Ты боишься старения. Твоя главная роль в сюжете — донор. Ты спасаешь чужого ребёнка и погибаешь. Твоё сердце продолжает жить в другом человеке. Твой путь: от «одинокого горшечника» до «трагического героя, чья доброта убила, но спасла». Это самый грустный персонаж во всём тесте. Если вытянул его — иди обними кого-нибудь." },
    { id:"8.1", name:"Ким Намджун", fic:"Птенчик", pairs: [[1,"B"],[2,"B"],[3,"G"],[4,"C"],[6,"A"],[7,"B"],[10,"B"],[11,"C"],[12,"A"],[13,"A"],[14,"B"],[16,"B"],[17,"A"],[18,"A"],[21,"A"],[25,"B"],[27,"G"],[32,"A"],[39,"D"]], desc: "Результат теста: «Злой медведь с ямочками и совестью»\nПсихологический портрет: Ты убиваешь за деньги, но не трогаешь женщин и детей. Спишь со случайными женщинами постарше — с ними безопасно, они не требуют души. Ты считаешь себя не заслуживающим любви. Боишься снов о семье. Появление подростка-сироты переворачивает жизнь. Ты становишься ему «отцом», а потом — любовником. Ты сдаёшься полиции, чтобы спасти его. Твой путь: от «никчёмного убийцы» до «фотографа и мужа». Даже наёмник может захотеть мира, если птенчик попросит." },
    { id:"8.2", name:"Чон Чонгук", fic:"Птенчик", pairs: [[1,"A"],[2,"C"],[3,"A"],[4,"C"],[5,"G"],[6,"A"],[7,"A"],[10,"C"],[11,"D"],[12,"A"],[14,"A"],[16,"I"],[17,"A"],[18,"A"],[19,"B"],[21,"A"],[25,"A"],[36,"A"],[39,"D"]], desc: "Результат теста: «Чёрноглазый воробей с дробовиком»\nПсихологический портрет: Ты подросток, видел смерть родителей. Зол на весь мир, смел до наглости и отчаянно хочешь любви. Твоя защита: грубость и упрямство. Быстро учишься стрелять и драться. Идёшь мстить в одиночку и чуть не погибаешь. Потом становишься врачом. Твой путь: от «потерянного птенца» до «сильного мужчины, который выбрал любовь, а не месть». Ты заслужил счастье, потому что не сломался. Татуировка птички на щиколотке — твоё клеймо надежды." },
    { id:"8.3", name:"Ким Сокджин", fic:"Птенчик", pairs: [[1,"C"],[2,"C"],[3,"G"],[4,"G"],[5,"B"],[6,"I"],[7,"H"],[10,"D"],[12,"G"],[13,"A"],[15,"B"],[16,"B"],[18,"E"],[20,"C"],[21,"C"],[25,"B"],[32,"B"],[35,"B"],[39,"E"]], desc: "Результат теста: «Громкая мама с принципами»\nПсихологический портрет: Ты ушёл из шоу-бизнеса и стал обычным офисным работником. Создаёшь уют и тепло везде, где появляешься. Сначала осуждаешь Юнги за его «серую» работу, но потом принимаешь — потому что любовь важнее предрассудков. Ты громкий, солнечный, спасаешь раненого киллера, вступаешься за подростка. Твой путь: от «разочарованного актёра» до «главы большой семьи». Даже киллеры плачут в твоих объятиях. Потому что ты держишь всех накормленными и обнятыми." },
    { id:"8.4", name:"Мин Юнги", fic:"Птенчик", pairs: [[1,"B"],[2,"B"],[4,"G"],[5,"B"],[6,"F"],[7,"G"],[8,"F"],[9,"A"],[11,"B"],[12,"C"],[13,"D"],[14,"B"],[16,"B"],[18,"A"],[20,"H"],[22,"B"],[25,"F"],[27,"B"],[32,"B"]], desc: "Результат теста: «Властный хищник с разбитым сердцем»\nПсихологический портрет: Тебя родные отвергли из-за твоей ориентации. Ты спас племянника и стал его опекуном. Носишь дорогие костюмы, ездишь на крутой машине, выглядишь неприступно. Твоя защита: статус и деньги. Но внутри одинок и готов на самопожертвование. Помогаешь киллеру, жертвуя карьерой. Уходишь из полиции, открываешь галерею. Твой путь: от «хищника» до «счастливого мужа». Готовишь как медитацию и любишь как последний раз." },
   { id:"8.5", name:"Чон Хосок", fic:"Птенчик", pairs: [[1,"I"],[2,"A"],[3,"E"],[4,"F"],[5,"F"],[7,"I"],[8,"B"],[9,"H"],[10,"H"],[12,"E"],[13,"F"],[14,"C"],[15,"E"],[18,"H"],[19,"F"],[20,"H"],[24,"F"],[33,"I"],[38,"F"]], desc: "Результат теста: «Франтоватый щёголь с боязнью крови»\nПсихологический портрет: Ты яркий, энергичный, но не можешь работать в полиции — при виде крови плохеет. Помогаешь внештатно. Ты верный друг, жизнерадостный. Именно ты находишь пропавшего подростка. Твой путь не драматичный — ты функция «внешняя поддержка». Появляешься на Рождество, спасаешь друга от депрессии. Ты тот друг, без которого сюжет бы не сдвинулся. Не герой, но мотор." },
    { id:"8.6", name:"Пак Чимин", fic:"Птенчик", pairs: [[1,"C"],[2,"C"],[3,"D"],[4,"D"],[5,"D"],[6,"F"],[7,"H"],[10,"H"],[12,"G"],[13,"E"],[14,"C"],[15,"I"],[16,"I"],[18,"C"],[21,"E"],[25,"I"],[27,"B"],[33,"C"],[39,"H"]], desc: "Результат теста: «Тактильный котёнок с тайной любовью»\nПсихологический портрет: Ты добрый, общительный, лазаешь по верёвочным паркам. Ты лучший друг главного героя. Твоя тайна: ты влюблён в школьного друга, но боишься признаться. У тебя нет большой арки — ты просто опора. Тот, кто возвращает друга к нормальной жизни через игры и дружбу. Твой девиз: «обниму и помогу». Иногда этого достаточно." },
    { id:"8.7", name:"Ким Тэхён", fic:"Птенчик", pairs: [[1,"I"],[3,"B"],[4,"F"],[5,"C"],[6,"B"],[7,"C"],[8,"H"],[9,"H"],[10,"H"],[12,"E"],[13,"F"],[14,"G"],[15,"C"],[16,"H"],[18,"H"],[19,"A"],[20,"B"],[33,"C"],[38,"H"]], desc: "Результат теста: «Учитель поцелуев на Рождество»\nПсихологический портрет: Ты высокий, яркий, со вкусом. Ты учишь целоваться того, кто боится. Твоя роль эпизодическая, но ключевая. Ты подталкиваешь к действию. Твой психотип: «свободный художник, который не боится быть странным». Если ты выпал на него — твоя задача: помочь другим решиться на то, на что они сами не смеют. И уйти в тень." },
    { id:"9.1.1", name:"Чон Чонгук (А)", fic:"Альтернативные мир А", pairs: [[1,"B"],[3,"D"],[5,"D"],[6,"G"],[7,"C"],[10,"B"],[11,"C"],[13,"A"],[14,"B"],[16,"B"],[18,"I"],[19,"B"],[21,"A"],[22,"H"],[23,"B"],[24,"B"],[32,"A"],[39,"D"],[40,"D"]], desc: "Результат теста: «Замкнутый принц с чёрной кошкой»\nПсихологический портрет: Ты альфа, который считал омег скучными. Но на самом деле ты просто боялся близости. У тебя комплекс неполноценности рядом с идеальным братом. Спасаешься побегами в другие миры во снах. Влюбляешься в омегу из другого мира — и впервые хочешь что-то по-настоящему. Пахнешь шалфеем и лавандой. Идёшь за истинным через реальность. Потому что во сне ты уже всё решил." },
    { id:"9.1.2", name:"Пак Чимин (А)", fic:"Альтернативные мир А", pairs: [[1,"C"],[3,"C"],[4,"B"],[5,"C"],[6,"C"],[7,"C"],[10,"B"],[12,"F"],[13,"E"],[15,"D"],[16,"E"],[18,"C"],[19,"D"],[20,"B"],[21,"C"],[25,"E"],[27,"F"],[35,"B"],[39,"H"]], desc: "Результат теста: «Творческая жертва токсичных отношений»\nПсихологический портрет: Ты омега, который боится истинной пары — у брата была трагедия. Встречаешься с альфой, который тебя не ценит. Ты талантливый художник, любишь пионы. Встречаешь своего истинного — но он с ребёнком от другого. Твой путь: от «забитого омеги» до «счастливой жены и опоры». Боялась любви, но рискнула. И правильно сделала." },
    { id:"9.1.3", name:"Чон Хосок (А)", fic:"Альтернативные мир А", pairs: [[1,"D"],[3,"A"],[4,"G"],[6,"I"],[7,"C"],[8,"B"],[10,"D"],[13,"A"],[14,"C"],[15,"C"],[16,"C"],[18,"E"],[19,"A"],[20,"H"],[23,"B"],[27,"F"],[32,"G"],[34,"H"],[39,"H"]], desc: "Результат теста: «Идеальный. Точка.»\nПсихологический портрет: Ты старший брат, «золотой мальчик». У тебя фиктивные отношения с омегой-другом (просто контракт, никаких чувств). Встречаешь истинного — бросаешь семейный бизнес, открываешь танцевальную студию. Пахнешь кедром и смолой. У твоего бывшего контрактного омеги будет ребёнок от тебя, и ты примешь его. Твой путь: от «должен» до «хочу». И научишься любить двоих." },
    { id:"9.1.4", name:"Мин Юнги (А)", fic:"Альтернативные мир А", pairs: [[2,"B"],[3,"B"],[4,"G"],[5,"F"],[6,"H"],[7,"H"],[8,"G"],[10,"B"],[11,"C"],[12,"F"],[13,"D"],[14,"B"],[16,"B"],[18,"B"],[21,"A"],[27,"F"],[31,"A"],[35,"A"],[39,"H"]], desc: "Результат теста: «Ледяная роза»\nПсихологический портрет: Не терпишь прикосновений. Прямолинейный и остроумный, в другом мире тебя называют «татарником». Ты — истинный альфы, который раньше не любил омег. Сначала больно, потом — любовь. Ты инициируешь переезд в другую страну. Твой путь: от «не доверяю» до «страстно люблю». Пахнешь розами, но шипы — внутри." },
    { id:"9.1.5", name:"Ким Тэхён (А)", fic:"Альтернативные мир А", pairs: [[1,"A"],[2,"A"],[4,"C"],[5,"E"],[6,"B"],[7,"A"],[10,"A"],[11,"D"],[12,"A"],[13,"A"],[14,"A"],[16,"C"],[18,"B"],[19,"A"],[21,"G"],[25,"C"],[27,"F"],[36,"C"],[39,"D"]], desc: "Результат теста: «Альфа-травматик с аллергией на мясо»\nПсихологический портрет: Ты альфа, который раньше влюблялся только в альф. Получил травму от омеги (тебя отвергли в юности). Скептичен. Но встречаешь своего омегу — и понимаешь, что ошибался. Переезжаешь в США, становишься актёром. Делаешь предложение на Бруклинском мосту. Твой путь: от «альфы, который ненавидел омег» до «альфы, который обожает своего омегу»." },
    { id:"9.1.6", name:"Ким Сокджин (А)", fic:"Альтернативные мир А", pairs: [[2,"F"],[3,"B"],[4,"H"],[7,"D"],[9,"C"],[11,"E"],[14,"H"],[17,"C"],[18,"F"],[19,"G"],[21,"H"],[23,"G"],[24,"G"],[26,"H"],[27,"H"],[28,"G"],[29,"H"],[32,"D"],[36,"I"]], desc: "Результат теста: «Омега номер один»\nПсихологический портрет: Ты был «девушкой» альфы по контракту. Забеременел от него, а он ушёл к истинному. Ты проходишь через боль, оставляешь ребёнка, идёшь в науку. Потом встречаешь альфу из другого мира и обретаешь счастье. Твой путь: от «отвергнутой договорной невесты» до «любимой жены из другого мира». Ты рыбачишь и философствуешь. И наконец-то тебя любят не по договору." },
    { id:"9.2.1", name:"Пак Чимин (В)", fic:"Альтернативные мир В", pairs: [[1,"G"],[2,"F"],[3,"F"],[5,"I"],[6,"D"],[8,"E"],[10,"G"],[11,"I"],[13,"C"],[14,"H"],[16,"H"],[27,"I"],[30,"H"],[32,"E"],[34,"B"],[35,"H"],[38,"C"],[39,"G"],[40,"G"]], desc: "Результат теста: «Романтик, которого предали»\nПсихологический портрет: Ты бухгалтер с душой художника. Твой парень изменил тебе. Ты страдаешь. Потом появляется альфа из другого мира. Ты учишься отстаивать себя и верить чувствам. В конце счастлив. Твой путь: от «жертвы обмана» до «человека, который выбрал себя»." },
    { id:"9.2.2", name:"Чон Хосок (В)", fic:"Альтернативные мир В", pairs: [[2,"H"],[3,"H"],[6,"D"],[9,"C"],[12,"C"],[13,"G"],[15,"F"],[17,"D"],[21,"E"],[26,"C"],[28,"B"],[30,"D"],[31,"H"],[32,"F"],[33,"B"],[34,"B"],[35,"C"],[38,"E"],[40,"E"]], desc: "Результат теста: «Жарче только Килиманджаро»\nПсихологический портрет: Ты танцор. Тебе снятся сны о брате, которого в этом мире нет. Но однажды он появляется — из другого мира. Ты обретаешь равновесие. Твой путь: от «тоски по семье» до «главы семьи». Не драма, а исполнение мечты." },
    { id:"9.2.3", name:"Мин Юнги (В)", fic:"Альтернативные мир В", pairs: [[1,"F"],[2,"H"],[4,"I"],[5,"C"],[6,"A"],[7,"D"],[8,"E"],[11,"D"],[15,"G"],[16,"H"],[19,"D"],[21,"F"],[25,"E"],[27,"A"],[29,"G"],[33,"E"],[34,"G"],[36,"A"],[39,"F"]], desc: "Результат теста: «Реставратор, сломавший реальность»\nПсихологический портрет: Ты закрытый столяр-реставратор. Даришь другу зеркало, которое соединяет миры. Помогаешь влюблённым из параллельных вселенных. Сближаешься с Хосоком из этого мира. Твой путь: от «скрытного мастера» до «активного участника мультивселенной». Случайно сломал реальность — и не жалеешь." },
        { id:"9.2.4", name:"Ким Намджун (В)", fic:"Альтернативные мир В", pairs: [[1,"E"],[2,"H"],[3,"B"],[4,"E"],[5,"G"],[6,"F"],[9,"I"],[10,"C"],[12,"C"],[13,"G"],[15,"C"],[17,"C"],[20,"C"],[21,"F"],[22,"H"],[26,"H"],[28,"C"],[31,"D"],[32,"D"]], desc: "Результат теста: «Запутавшийся альфа, который сбежал в другой мир»\nПсихологический портрет: Ты изменил своему омеге с другим — и сам не понял зачем. Теряешь родителей, работу, отношения. Совершаешь отчаянный поступок: меняешься душами с альфой из другого мира и уходишь туда. Там становишься счастлив с омегой, который тебя ждал. Твой путь: от «разрушителя чужих сердец» до «человека, который нашёл себя в чужой реальности». Сбежал от себя — и догнал." },

   { id:"11.3", name:"Мин Юнги", fic:"Нигредо", pairs: [[1,"F"],[4,"B"],[5,"H"],[7,"B"],[11,"D"],[13,"B"],[16,"E"],[18,"I"],[21,"H"],[27,"C"],[30,"D"],[31,"I"],[32,"F"],[33,"I"],[34,"I"],[36,"G"],[37,"G"],[39,"G"],[40,"C"]], desc: "Результат теста: «Волк с горячим сердцем»\nПсихологический портрет: Ты хромой герой войны, следователь. Считаешь, что любовь должна жить без телесности — боишься близости. Предан друзьям. Удочеряешь девочек. Учишься проявлять нежность. Твой путь: от «мёртвой любви» до «живого волка». Сначала стреляешь, потом признаёшься в любви. В таком порядке." },
    { id:"11.4", name:"Чон Хосок", fic:"Нигредо", pairs: [[4,"E"],[6,"G"],[9,"F"],[12,"H"],[13,"D"],[14,"C"],[15,"E"],[16,"F"],[17,"I"],[21,"I"],[24,"H"],[25,"H"],[27,"D"],[29,"G"],[31,"G"],[34,"D"],[36,"H"],[39,"F"],[40,"E"]], desc: "Результат теста: «Тихий эксперт с ложным дном»\nПсихологический портрет: Ты застенчивый ботаник, который умеет только то, что умеет (разбирается в розах). Не умеешь торговаться и спорить. Твой путь: от «тихони» до «смелого любовника». Невидимый герой, который вдруг становится видимым. Потому что кто-то заметил твои розы." },
    { id:"11.5", name:"Пак Чимин", fic:"Нигредо", pairs: [[1,"A"],[4,"I"],[6,"C"],[8,"G"],[11,"B"],[12,"E"],[13,"G"],[15,"B"],[16,"G"],[18,"D"],[19,"E"],[24,"B"],[26,"E"],[27,"E"],[30,"H"],[31,"H"],[33,"E"],[37,"E"],[39,"I"]], desc: "Результат теста: «Восточный лебедь и лиса в одном флаконе»\nПсихологический портрет: Ты гениальный танцовщик. Хрупкий внешне, но хитрая лиса с девятью хвостами. Прекрасно готовишь и умеешь вскружить голову. Твоя суть: кажущаяся нежность скрывает стальной стержень." },
   { id:"11.6", name:"Ким Тэхён", fic:"Нигредо", pairs: [[4,"B"],[5,"G"],[6,"G"],[8,"G"],[10,"F"],[11,"G"],[12,"G"],[13,"H"],[14,"F"],[15,"H"],[17,"B"],[19,"I"],[27,"G"],[29,"E"],[32,"E"],[34,"D"],[36,"E"],[38,"C"],[39,"I"]], desc: "Результат теста: «Солнечный офицер с отцом-монстром»\nПсихологический портрет: Ты светлый, тёплый, любимец общества. Блестящий гвардеец и лучший друг. Но твой отец — монстр. Твой путь: от «идеалиста» до «мудрого мужчины, который видит не только свет, но и тьму — и принимает её». Ты ревнивый, но всепрощающий. Потому что научился у отца не повторять его ошибок." },
   { id:"11.7", name:"Чон Чонгук", fic:"Нигредо", pairs: [[2,"I"],[4,"A"],[6,"D"],[7,"E"],[11,"E"],[14,"C"],[15,"E"],[19,"D"],[22,"G"],[23,"G"],[25,"I"],[27,"H"],[29,"I"],[30,"I"],[33,"H"],[35,"I"],[37,"H"],[39,"G"],[40,"C"]], desc:  "Результат теста: «Барон-педант с огромным сердцем»\nПсихологический портрет: Ты молодой следователь, аскет с феноменальной памятью. Подавляешь свою гомосексуальность как нечто «неправильное». Педантичен до мании: всё по полочкам. Твой путь: от «холодного аналитика» до «свободного любовника». Ты раскладываешь улики по полочкам, но в итоге следуешь за сердцем. И впервые в жизни не считаешь это ошибкой." }

    // --------------------------------------------------------------
    // ЛОГИКА ТЕСТА (с выводом до 5 персонажей, включая всех с максимальным баллом)
    // --------------------------------------------------------------
    let userAnswers = new Array(40).fill(null);
    let currentQuestion = 0;

    function renderQuestion() {
        const q = questions[currentQuestion];
        const optionsHtml = Object.entries(q.options).map(([letter, text]) => `
            <div class="option" data-letter="${letter}">
                <div class="option-letter">${letter}</div>
                <div class="option-text">${text}</div>
            </div>
        `).join('');
        const progressWidth = (currentQuestion / 40) * 100;
        document.getElementById("testArea").innerHTML = `
            <div class="progress-area">
                <div class="progress-bar-bg"><div class="progress-fill" style="width: ${progressWidth}%"></div></div>
                <div class="q-counter">${currentQuestion+1}/40</div>
            </div>
            <div class="question-card">
                <div class="question-text">${q.text}</div>
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                <div class="nav-buttons">
                    <button id="prevBtn" ${currentQuestion===0 ? 'disabled' : ''}>◀ Назад</button>
                    <button id="nextBtn" class="primary">${currentQuestion===39 ? 'Завершить' : 'Далее ▶'}</button>
                </div>
            </div>
        `;
        
        if (userAnswers[currentQuestion]) {
            const selectedDiv = document.querySelector(`.option[data-letter="${userAnswers[currentQuestion]}"]`);
            if (selectedDiv) selectedDiv.classList.add('selected');
        }
        
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', () => {
                const letter = opt.dataset.letter;
                userAnswers[currentQuestion] = letter;
                renderQuestion();
            });
        });
        document.getElementById('prevBtn')?.addEventListener('click', () => {
            if (currentQuestion > 0) { currentQuestion--; renderQuestion(); }
        });
        document.getElementById('nextBtn')?.addEventListener('click', () => {
            if (userAnswers[currentQuestion] === null) { alert("Выберите вариант ответа!"); return; }
            if (currentQuestion === 39) finishTest();
            else { currentQuestion++; renderQuestion(); }
        });
    }

    function finishTest() {
    let scores = characters.map(ch => {
        let score = 0;
        for (let [qNum, expectedLetter] of ch.pairs) {
            if (userAnswers[qNum-1] === expectedLetter) score++;
        }
        return { ...ch, score };
    });

    scores.sort((a,b) => b.score - a.score);

    const maxScore = scores[0].score;
    const primaryMatches = scores.filter(ch => ch.score === maxScore);
    const others = scores.filter(ch => ch.score !== maxScore);

    // Формируем список до 7: сначала все главные, потом добираем из others
    let finalList = [...primaryMatches];
    if (finalList.length < 7) {
        const need = 7 - finalList.length;
        finalList.push(...others.slice(0, need));
    }
    const otherDisplay = finalList.filter(ch => !primaryMatches.includes(ch));

    let resultsHtml = `<div class="result-box"><div class="top3-title">🌟 Твой результат 🌟</div>`;

    if (primaryMatches.length === 1) {
        const main = primaryMatches[0];
        resultsHtml += `
            <div class="character-name">${main.name}</div>
            <div class="character-fic">${main.fic}</div>
            <div class="character-desc">${main.desc}<br><br>✨ Совпадений: ${main.score} из ${main.pairs.length}<br>🖤 Твой внутренний персонаж найден.</div>
        `;
    } else {
        // Несколько главных — выводим каждого с полным описанием
        for (let ch of primaryMatches) {
            resultsHtml += `
                <div style="margin-bottom: 40px; border-bottom: 1px dashed #f3cba8; padding-bottom: 20px;">
                    <div class="character-name">${ch.name}</div>
                    <div class="character-fic">${ch.fic}</div>
                    <div class="character-desc">${ch.desc}<br><br>✨ Совпадений: ${ch.score} из ${ch.pairs.length}</div>
                </div>
            `;
        }
        resultsHtml += `<div style="text-align: center; margin: 0 0 25px; color: #b97f5e; font-weight: 500;">🏆 У тебя несколько персонажей с максимальным баллом — выбирай любого!</div>`;
    }

    // Ближайшие по духу (если есть)
    if (otherDisplay.length > 0) {
        resultsHtml += `<div class="top3-title">✨ Ближайшие по духу ✨</div><div class="top3-grid">`;
        const medals = ['🥈', '🥉', '4️⃣', '5️⃣', '6️⃣', '7️⃣'];
        for (let i = 0; i < otherDisplay.length; i++) {
            const ch = otherDisplay[i];
            resultsHtml += `
                <div class="top3-card">
                    <div class="medal">${medals[i]}</div>
                    <div class="top3-name">${ch.name}</div>
                    <div class="top3-fic">${ch.fic}</div>
                    <div class="top3-score">🎯 ${ch.score} / ${ch.pairs.length}</div>
                </div>
            `;
        }
        resultsHtml += `</div>`;
    }

    resultsHtml += `<button class="restart-btn" id="restartTest">🔁 Пройти заново</button></div>`;

    document.getElementById("testArea").innerHTML = resultsHtml;
    document.getElementById("restartTest")?.addEventListener("click", () => {
        userAnswers = new Array(40).fill(null);
        currentQuestion = 0;
        renderQuestion();
    });
}

    renderQuestion();
</script>
