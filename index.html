        { text: "Как вы переживаете разрыв отношений?", options: { A: "Очень тяжело, могу впасть в депрессию с попытками суицида.", B: "Внешне спокойно, а внутри всё сгорает.", C: "Начинаю мстить или доказывать, что я лучше.", D: "Ищу утешения в работе, алкоголе или наркотиках.", E: "Плачу, но иду дальше, потому что жизнь продолжается.", F: "Удаляю все контакты и стираю память.", G: "Поддерживаю дружбу, чтобы не потерять человека.", H: "Анализирую ошибки, чтобы не повторять.", I: "Бросаюсь в новые отношения сразу." } },
        { text: "Как вы относитесь к деньгам и роскоши?", options: { A: "Роскошь — это безопасность, я люблю красивые вещи.", B: "Деньги — инструмент, не более. Живу скромно.", C: "Легко трачу, люблю делать дорогие подарки близким.", D: "Боюсь бедности, коплю на чёрный день.", E: "Мне всё равно, главное — чтобы любимые были сыты.", F: "Люблю роскошь, но стесняюсь этого.", G: "Предпочитаю тратить на впечатления, а не на вещи.", H: "Считаю деньги злом, но без них никуда.", I: "Богатство — это свобода, к нему стремлюсь." } },
        { text: "Что для вас важнее: быть любимым или понимаемым?", options: { A: "Любимым. Понимание придёт потом.", B: "Понимаемым. Любовь без понимания — пытка.", C: "И то, и другое, иначе нет смысла.", D: "Мне достаточно уважения и спокойствия.", E: "Принятие таким, какой я есть, даже если не понимают.", F: "Быть ценным для партнёра.", G: "Чтобы разделяли мои ценности.", H: "Чтобы поддерживали в трудную минуту.", I: "Чтобы восхищались мной." } },
        { text: "Как вы реагируете на чужую боль?", options: { A: "Сразу бегу помогать, даже в ущерб себе.", B: "Сочувствую, но держу дистанцию, боюсь перегрузиться.", C: "Выключаю эмоции, становлюсь холодным.", D: "Плачу вместе с человеком.", E: "Ищу практическое решение: таблетку, деньги, адвоката.", F: "Обнимаю и молчу, чтобы не травмировать словами.", G: "Отвлекаю разговорами о хорошем.", H: "Считаю, что каждый должен справляться сам.", I: "Даю совет, даже если не просят." } },
        { text: "Какое ваше любимое время года и почему?", options: { A: "Весна — время обновления и надежды.", B: "Осень — меланхолия и красота увядания.", C: "Зима — можно укутаться в плед и никуда не выходить.", D: "Лето — жара, активность, экстрим.", E: "Мне нравится смена сезонов, каждый по-своему.", F: "Люблю зиму за праздники.", G: "Осень за урожай и уют.", H: "Весну за цветение.", I: "Лето за отпуск и путешествия." } },
        { text: "Что вы делаете, если чувствуете, что партнёр вас разлюбляет?", options: { A: "Начинаю цепляться сильнее, заваливаю заботой.", B: "Ухожу первым, чтобы не бросили.", C: "Устраиваю скандал и выясняю всё до конца.", D: "Терплю и молчу, надеюсь, что пройдёт.", E: "Даю свободу, если не любит — значит, не судьба.", F: "Пытаюсь вернуть страсть сюрпризами.", G: "Плачу и прошу остаться.", H: "Становлюсь холодным и отстранённым.", I: "Наблюдаю и собираю доказательства." } },
        { text: "Как вы относитесь к своей сексуальности?", options: { A: "Долгое время скрывал, стыдился, теперь принимаю.", B: "Всегда было нормально, просто не афиширую.", C: "Травмирован прошлым, боюсь близости.", D: "Очень люблю, это важная часть жизни.", E: "Есть особенности, которые я долго не принимал.", F: "Считаю, что это личное, никого не касается.", G: "Экспериментирую и изучаю себя.", H: "Стыжусь и пытаюсь подавлять.", I: "Открыт для обсуждения, но без фанатизма." } },
        { text: "Что для вас «дом»?", options: { A: "Место, где я могу быть один и никто не трогает.", B: "Там, где мои любимые люди.", C: "Порядок, чистота, всё по полочкам.", D: "Творческий хаос: краски, глина, ноты.", E: "Дом там, где вкусно пахнет.", F: "Место, где можно снять маску.", G: "Стены, в которых я вырос.", H: "Квартира, которую я сам обустроил.", I: "Любое место, где есть ноутбук и кофе." } },
        { text: "Как вы справляетесь с чувством одиночества?", options: { A: "Терплю, привык, иногда даже нравится.", B: "Заполняю его работой или хобби до изнеможения.", C: "Иду в гости или звоню друзьям.", D: "Плачу и чувствую себя ничтожеством.", E: "Завожу животное.", F: "Записываю свои мысли в дневник.", G: "Иду на свидание или ищу приключений.", H: "Принимаю как данность и продолжаю жить.", I: "Смотрю фильмы или сериалы, чтобы отвлечься." } },
        { text: "Как вы ведёте себя на свидании?", options: { A: "Очаровываю, шучу, делаю комплименты.", B: "Стесняюсь, могу покраснеть и замолчать.", C: "Веду себя естественно, как в жизни.", D: "Проверяю партнёра на прочность.", E: "Устраиваю необычный сюрприз или приключение.", F: "Много говорю о себе, боюсь пауз.", G: "Расспрашиваю о прошлых отношениях.", H: "Стараюсь понравиться любой ценой.", I: "Предпочитаю короткие свидания без обязательств." } },
        { text: "Как вы относитесь к своей уязвимости?", options: { A: "Скрываю её любой ценой, это моя слабость.", B: "Принимаю, но только с очень близкими.", C: "Стыжусь, считаю, что мужчина не должен плакать.", D: "Уязвимость — это моя сила, я не боюсь её показывать.", E: "Боюсь, что если покажу уязвимость, меня используют.", F: "Показываю только в безопасной обстановке.", G: "Уязвимость — это признак доверия, я это ценю.", H: "Не любимо, но умею распознать у других.", I: "Считаю, что уязвимость — это слабость, которую нужно преодолеть." } },
        { text: "Что вы делаете, когда злитесь?", options: { A: "Могу ударить стену или сломать что-то.", B: "Сжимаю зубы и молчу, потом долго отхожу.", C: "Спорю, доказываю свою правоту.", D: "Ухожу в себя или физически удаляюсь.", E: "Рисую или пишу злые стихи.", F: "Иду в спортзал или бегу.", G: "Молча делаю домашние дела.", H: "Закрываюсь в комнате и плачу.", I: "Кричу на того, кто вызвал злость." } },
        { text: "Как вы переживаете неудачу?", options: { A: "Виня себя, самобичуюсь днями и ночами.", B: "Злюсь на обстоятельства или других.", C: "Анализирую ошибки, делаю выводы и иду дальше.", D: "Впадаю в апатию, могу бросить начатое.", E: "Расстраиваюсь, но быстро нахожу новую цель.", F: "Ищу утешения в еде или развлечениях.", G: "Сравниваю с чужими успехами и завидую.", H: "Прошу помощи и совета.", I: "Стараюсь забыть и не возвращаться." } },
        { text: "Какая черта характера у других вызывает у вас восхищение?", options: { A: "Смелость и прямота.", B: "Терпение и мудрость.", C: "Нежность и забота.", D: "Способность радоваться мелочам.", E: "Ум и хладнокровие.", F: "Честность и принципиальность.", G: "Юмор и жизнерадостность.", H: "Трудолюбие и целеустремлённость.", I: "Эмпатия и умение слушать." } },
        { text: "Что для вас любовь?", options: { A: "Битва, в которой нужно победить сомнения.", B: "Тихая гавань, где можно отдохнуть.", C: "Одержимость и полное растворение.", D: "Риск, на который идёшь, зная, что можешь разбиться.", E: "Ежедневный труд и выбор оставаться рядом.", F: "Искра, которая быстро гаснет.", G: "Слияние душ и тел.", H: "Безусловное принятие.", I: "Радость и вдохновение каждый день." } },
        { text: "Если бы вы могли загадать одно желание для себя, то какое?", options: { A: "Научиться прощать себя.", B: "Перестать бояться близости.", C: "Обрести внутреннюю свободу.", D: "Найти свой дом и семью.", E: "Стать тем, кем я есть на самом деле.", F: "Обрести душевный покой.", G: "Найти своё призвание.", H: "Пережить всех, кто мне дорог.", I: "Исполнить мечту детства." } }

    const characters = [
        { id:"1.1", name:"Чон Чонгук", fic:"Не все герои носят плащи", pairs: [[1,"A"],[11,"D"],[16,"A"],[18,"C"],[36,"A"]], desc: "«Талантливый киборг» – сначала кусаешь, потом думаешь. Твоя суперсила — невероятное упрямство, суперслабость — пари на три месяца в инвалидной коляске. Не умеешь врать, разрушаешь вечеринки честностью. В любви романтик, даришь цветы и тут же их роняешь." },
        { id:"1.2", name:"Мин Юнги", fic:"Не все герои носят плащи", pairs: [[5,"A"],[7,"E"],[25,"D"],[26,"A"],[33,"B"]], desc: "«Человек-нерв» – разбиваешь зеркала, даришь вертолёты. «Спасатель, который сбегает»: при отвержении уходишь в запой. Ревнив как дракон, заботлив как наседка. Строишь IT-империи, страдаешь в роскоши под Дебюсси." },
        { id:"1.3", name:"Пак Чимин", fic:"Не все герои носят плащи", pairs: [[4,"G"],[6,"I"],[16,"B"],[22,"E"],[39,"E"]], desc: "«Дай бог каждому такого брата» – держишь всех на плечах, боишься быть недостаточно хорошим. Эмоционально устойчив до жути, но слишком долго терпишь. Кардиостимулятор для битых персонажей." },
        { id:"1.4", name:"Ким Тэхён", fic:"Не все герои носят плащи", pairs: [[2,"B"],[10,"E"],[16,"D"],[30,"B"],[35,"E"]], desc: "«Эстет и немножечко садист» – избегающий тип, веришь что отношения развалятся через три месяца. Носишь белую шубу, слушаешь Вагнера, паникуешь от «нам надо поговорить». Умеешь носить на руках и делать предложения под рояль." },
        { id:"1.5", name:"Чон Хосок", fic:"Не все герои носят плащи", pairs: [[3,"E"],[15,"E"],[19,"A"],[33,"C"],[39,"F"]], desc: "«Батарейка с полиаморным потенциалом» – с кровью горячей, считаешь младших братьев своими детьми. Не выносишь одиночества, компенсируешь громким смехом. Окажешься в центре странной, но тёплой семьи." },
        { id:"1.6", name:"Ким Намджун", fic:"Не все герои носят плащи", pairs: [[8,"A"],[9,"B"],[14,"B"],[20,"H"],[38,"B"]], desc: "«Мудрый корень» – выращиваешь бонсай, рассуждаешь о любви вместо драк. Вызвал скорую Чонгуку и не растерялся. Терпение камня, но когда решаешься – расцветаешь." },
        { id:"1.7", name:"Ким Сокджин", fic:"Не все герои носят плащи", pairs: [[12,"E"],[17,"A"],[18,"H"],[36,"B"],[37,"C"]], desc: "«Ироничный киборг» – шутишь до упаду, потому что протез. Стратегия: «Смеюсь, значит, живу». Травму переигрываешь в комедию. Самый здоровый из всех нездоровых." },
        { id:"2.1", name:"Чон Чонгук (Хаттори)", fic:"Великая сила искусства", pairs: [[12,"B"],[15,"G"],[20,"B"],[31,"F"],[32,"A"]], desc: "«Самурай с татуировками» – чёрная одежда, псевдоним, тотальный контроль. На деле стеклодув, плачущий в одиночестве. Ревнив, но умеешь прощать. Если помыл посуду – это метафора очищения кармы." },
        { id:"2.2", name:"Пак Чимин", fic:"Великая сила искусства", pairs: [[3,"B"],[5,"D"],[20,"G"],[31,"A"],[36,"C"]], desc: "«Тиран, который крякает» – маниакальный порядок, каллиграфия, жизнь по расписанию. Скрывал ориентацию – чуть не застрелился. Когда хорошо – крякаешь. Психотип: или идеальный порядок, или самоуничтожение." },
        { id:"2.3", name:"Мин Юнги", fic:"Великая сила искусства", pairs: [[10,"C"],[13,"A"],[16,"E"],[21,"A"],[40,"A"]], desc: "«Лис, инсценировавший свою смерть» – гениальный неуч, голоса в голове шепчут «ты недостоин». Стратегия: умереть официально, жить нелегально. Пишешь стихи на теле, боишься близости. Твой голос гипнотизирует ФБР." },
        { id:"2.4", name:"Ким Тэхён", fic:"Великая сила искусства", pairs: [[6,"B"],[18,"G"],[19,"I"],[24,"H"],[27,"E"]], desc: "«Гроза преступников с саксофоном» – рано потерял родителей, притворяешься легкомысленным. Галантен с девушками, но верен мужчине. Садишься на колени к друзьям, говоришь «я бесконечно тебя люблю». Тащишь на себе весь сюжет." },
        { id:"2.5", name:"Ким Намджун", fic:"Великая сила искусства", pairs: [[6,"C"],[14,"G"],[27,"B"],[32,"B"],[40,"I"]], desc: "«Умный папа с ямочками на щеках» – знаешь 6 языков, долго не мог сказать «люблю». Суперсила – объятия. Ужасно поёшь – и это прекрасно. Если ты в комнате, скоро там будет уютно и безопасно." },
        { id:"2.6", name:"Ким Сокджин", fic:"Великая сила искусства", pairs: [[4,"D"],[13,"E"],[17,"F"],[26,"F"],[30,"B"]], desc: "«Бриллиант с травмой Лаоса» – элегантный, любит клубнику, не выносит японский язык. Умеешь стрелять между бровей, но предпочитаешь поить чаем. Не веришь, что достоин счастья." },
        { id:"2.7", name:"Чон Хосок", fic:"Великая сила искусства", pairs: [[11,"H"],[14,"A"],[25,"I"],[28,"A"],[34,"E"]], desc: "«Плейбой с английскими ирисками» – яркий, лёгкий на подъём. Был роман с Чонгуком, неразделёнка с Юнги, потом переосмысление. Импульсивен и раним. В итоге – семьянин. И ты всё ещё классно танцуешь." },
        { id:"3.1", name:"Чон Хосок", fic:"Солнечная улыбка убийцы", pairs: [[3,"C"],[12,"A"],[21,"F"],[28,"D"],[40,"F"]], desc: "«Сломленный солнечный зайчик» – взял чужую вину, в тюрьме шьёшь игрушки и пишешь сказки. Ложное чувство вины размером с Галактику. Девиз: «Я не заслужил дышать… ой, а оказывается, заслужил»." },
        { id:"3.2", name:"Ким Тэхён", fic:"Солнечная улыбка убийцы", pairs: [[3,"D"],[20,"D"],[31,"C"],[32,"D"],[35,"F"]], desc: "«Хриплый ангел со счётом до десяти» – боишься прикосновений, считаешь браслеты. Доверяешь только тому, кто сам битый. Учебник по преодолению ПТСР в картинках (которые сам рисуешь)." },
        { id:"3.3", name:"Ким Сокджин", fic:"Солнечная улыбка убийцы", pairs: [[2,"F"],[13,"D"],[22,"F"],[28,"E"],[30,"A"]], desc: "«Гиперопекающий краш» – пожертвовал личной жизнью ради брата с травмой. Пьёшь ромашковый чай, выглядишь как кинозвезда, внутри выгорание. С тобой безопасно, но стену нужно сначала уговорить." },
        { id:"3.4", name:"Мин Юнги", fic:"Солнечная улыбка убийцы", pairs: [[1,"G"],[18,"A"],[24,"B"],[37,"C"],[38,"E"]], desc: "«Молчаливый детектив с кофе и ремонтом» – выражаешь любовь через ремонт и внимательность. Утренняя злюка, без кофе ты не хирург, а бомж. Включаешь здравый смысл, когда все паникуют." },
        { id:"3.5", name:"Пак Чимин", fic:"Солнечная улыбка убийцы", pairs: [[11,"A"],[15,"C"],[29,"A"],[34,"C"],[39,"G"]], desc: "«Тактильный тайный порнописатель» – пережил рак, ценишь каждую секунду. Носишь белое, катаешься на лонгборде, обнимаешь всех подряд. В тайне пишешь горячие романы. Философия: «Жизнь коротка, обниму сейчас»." },
        { id:"3.6", name:"Ким Намджун", fic:"Солнечная улыбка убийцы", pairs: [[1,"B"],[6,"A"],[12,"F"],[18,"I"],[32,"G"]], desc: "«Заботливый медведь с ямочками и тату 707» – сидишь в тюрьме за самооборону, тоскуешь по дочери. Играешь роль папы для Хосока. Не кричишь – действуешь. Если сказал «я люблю» – это навсегда. Ямочки убивают наповал." },
        { id:"4.1", name:"Ким Намджун", fic:"Дракона подавать холодным", pairs: [[13,"C"],[16,"D"],[21,"G"],[35,"A"],[40,"E"]], desc: "«Аскетичный вулкан с чувством вины» – сбежал от криминала, выращиваешь овощи. Думаешь, что ты чудовище. Путь от дракона до домашнего кота, который всё ещё может убить, но не хочет." },
        { id:"4.2", name:"Ким Сокджин", fic:"Дракона подавать холодным", pairs: [[4,"F"],[19,"C"],[20,"C"],[22,"E"],[31,"B"]], desc: "«Ледяная маска с кипящим внутри рагу» – строишь ресторан мечты матери. Носишь ледяную маску, боишься доверять. Кулинарный самурай: режешь лук и плачешь не от него." },
        { id:"4.3", name:"Ким Тэхён", fic:"Дракона подавать холодным", pairs: [[1,"H"],[10,"C"],[36,"F"],[37,"B"],[39,"C"]], desc: "«Та ещё ведьма» – не стал актёром, но играешь драму каждый день. Ревнив, вспыльчив, можешь быть колючим. Стратегия: «Ударь первым, чтобы не ударили тебя». Красив до безобразия и после." },
        { id:"4.4", name:"Чон Чонгук", fic:"Дракона подавать холодным", pairs: [[2,"E"],[12,"G"],[17,"H"],[23,"C"],[31,"E"]], desc: "«Верующий упрямец с внутренним грехом» – религия и любовь к Тэхёну воюют внутри. Аккуратист, страдаешь от мигрени. Считаешь, что любить мужчину – грех, но не можешь без этого. Путь от правильного католика до счастливого грешника." },
        { id:"4.5", name:"Мин Юнги", fic:"Дракона подавать холодным", pairs: [[1,"D"],[13,"A"],[25,"G"],[33,"B"],[38,"G"]], desc: "«Циничный мститель с глубокой раной» – приехал травить брата, которого не знал. Защита – ненависть вместо боли. Мрачный, циничный, но внутри – романтик. Путь от «я отомщу» до «я люблю и принимаю»." },
        { id:"4.6", name:"Пак Чимин", fic:"Дракона подавать холодным", pairs: [[3,"F"],[10,"B"],[16,"A"],[20,"A"],[21,"H"]], desc: "«Немой, но талантливый» – не говоришь из-за травмы, но мурлычешь, когда гладят. Кондитерский гений. В любви обретаешь голос. Невербальная коммуникация громче слов." },
        { id:"4.7", name:"Чон Хосок", fic:"Дракона подавать холодным", pairs: [[9,"A"],[15,"G"],[19,"H"],[24,"H"],[27,"A"]], desc: "«Энерджайзер с грядками» – делаешь лучший кофе, выращиваешь травы. Эмоциональный центр триады. Садовник душ: поливаешь, удобряешь и ждёшь, пока расцветут колючие кактусы." },
        { id:"5.1", name:"Чон Чонгук", fic:"О праведное пламя!", pairs: [[5,"F"],[7,"C"],[14,"D"],[16,"C"],[35,"A"]], desc: "«Булка под маской генерала» – научили только воевать, не понимаешь чувств. Считаешь себя сломленным. Огонь не страшен, страшны чувства. Путь от боевой машины до мужа и виноградаря." },
        { id:"5.2", name:"Чон Хосок", fic:"О праведное пламя!", pairs: [[12,"E"],[16,"B"],[28,"G"],[39,"B"],[40,"D"]], desc: "«Сломленная, но горящая святыня» – прошёл рабство и насилие, сохранил солнечную суть. Умеешь прощать – чудо. Связан с лошадьми и огнём. Нежность сильнее жестокости. Можешь поджечь врага взглядом." },
        { id:"5.3", name:"Ким Намджун", fic:"О праведное пламя!", pairs: [[14,"B"],[21,"C"],[23,"B"],[27,"G"],[38,"B"]], desc: "«Мудрый миротворец с палочкой» – никогда не проигрываешь в чатурангу. Хромаешь, но не жалуешься. Твоё спокойствие заставляет других успокоиться просто потому, что ты рядом." },
        { id:"5.4", name:"Ким Сокджин", fic:"О праведное пламя!", pairs: [[4,"I"],[13,"E"],[29,"B"],[30,"E"],[35,"B"]], desc: "«Красивый манипулятор с травмой» – потерял жену и сына, носишь маску холодного царедворца. Ненавидишь огонь. Видишь суть людей. Путь от машины государства до счастливого мужа." },
        { id:"5.5", name:"Мин Юнги", fic:"О праведное пламя!", pairs: [[8,"D"],[10,"B"],[23,"G"],[33,"A"],[37,"D"]], desc: "«Безумный цветовод с нитями судеб» – видишь будущее, живёшь с проклятием безумия. Носишь белое, говоришь загадками. Путь от проклятого пророка до свободного художника." },
        { id:"5.6", name:"Ким Тэхён", fic:"О праведное пламя!", pairs: [[2,"A"],[5,"E"],[15,"D"],[29,"G"],[40,"C"]], desc: "«Ребёнок-феникс в красном» – 20 лет в заточении, вышел любопытным и добрым. Боишься белого, любишь красное. Не умеешь врать. Философия: «Свобода – когда можно рисовать даже на стенах»." },
        { id:"5.7", name:"Пак Чимин", fic:"О праведное пламя!", pairs: [[10,"F"],[18,"E"],[28,"H"],[30,"E"],[32,"I"]], desc: "«Хрупкий тростник, который не ломается» – был продан в рабство, сохранил нежность и талант. Играешь на флейте. Путь от украшения дома до самостоятельной личности." },
        { id:"6.1", name:"Ким Тэхён", fic:"Танец с невидимым врагом", pairs: [[5,"I"],[11,"C"],[16,"G"],[17,"G"],[35,"F"]], desc: "«Умирающий лев с пистолетом на могиле» – 50 лет, болен хореей Гентингтона. Отказываешься от любви, потому что «зачем, если умру». Путь от «я должен страдать» до «я имею право жить»." },
        { id:"6.2", name:"Чон Хосок", fic:"Танец с невидимым врагом", pairs: [[1,"F"],[10,"H"],[21,"E"],[25,"C"],[34,"B"]], desc: "«Молодой наглец с тату бабочки» – с детства вырезал фото Тэхёна, чтобы ненавидеть. Пришёл мстить, а влюбился. Месть превращается в любовь. Боишься воды, но готов нырнуть в отношения." },
        { id:"7.1", name:"Ким Тэхён", fic:"Последнее желание", pairs: [[3,"B"],[23,"C"],[24,"D"],[25,"F"],[37,"G"]], desc: "«Эмоциональная губка с тревожностью» – ведёшь блокнот желаний, чтобы не умереть от тоски. Быстро привязываешься, боишься повторения боли. Путь от страха нового до смелого мужа." },
        { id:"7.2", name:"Мин Юнги", fic:"Последнее желание", pairs: [[8,"F"],[13,"B"],[16,"E"],[21,"D"],[35,"G"]], desc: "«Отстранённый романтик со шрамом» – не чувствуешь желаний, готовишься умереть от болезни сердца. Тэхён вытаскивает тебя в жизнь. Путь от живого трупа до отчаянно живого." },
        { id:"7.3", name:"Чон Хосок", fic:"Последнее желание", pairs: [[15,"H"],[19,"E"],[20,"G"],[22,"A"],[31,"G"]], desc: "«Наседка с графиком» – живёшь по расписанию, чтобы контролировать тревогу. Убираешь, готовишь, заботишься. Путь от организатора быта до чувственного мужчины." },
        { id:"7.4", name:"Чон Чонгук", fic:"Последнее желание", pairs: [[15,"A"],[19,"F"],[24,"C"],[34,"G"],[36,"G"]], desc: "«Энергичный жаворонок с травмой утраты» – сбежал от боли потери матери. Тактильный, прямолинейный, язвительный в шутках. Учишься быть ведомым – для тебя это подвиг." },
        { id:"7.5", name:"Ким Намджун", fic:"Последнее желание", pairs: [[1,"E"],[8,"C"],[20,"B"],[22,"C"],[40,"H"]], desc: "«Вечные хризантемы не вянут» – разучился чувствовать через объектив. Сожалеешь о прошлых поверхностных связях. Учишься не физической, а эмоциональной близости." },
        { id:"7.6", name:"Ким Сокджин", fic:"Последнее желание", pairs: [[12,"I"],[28,"B"],[32,"G"],[39,"I"],[40,"F"]], desc: "«Талантливый донор» – делаешь керамику, скрываешь печаль. Добросердечен до самопожертвования. Твоя доброта – и сила, и проклятие. Самый грустный персонаж. Иди обними кого-нибудь." },
        { id:"8.1", name:"Ким Намджун", fic:"Птенчик", pairs: [[2,"I"],[11,"B"],[12,"H"],[25,"B"],[32,"H"]], desc: "«Злой медведь с ямочками и совестью» – убиваешь за деньги, но не трогаешь слабых. Считаешь себя не заслуживающим любви. Появление Чонгука переворачивает жизнь. Путь от никчёмного убийцы до фотографа и мужа." },
        { id:"8.2", name:"Чон Чонгук", fic:"Птенчик", pairs: [[1,"H"],[11,"D"],[16,"F"],[19,"D"],[36,"F"]], desc: "«Чёрноглазый воробей с дробовиком» – подросток, видевший смерть родителей. Зол на весь мир, отчаянно нуждаешься в любви. Путь от потерянного птенца до сильного мужчины. Тату птички – клеймо надежды." },
        { id:"8.3", name:"Ким Сокджин", fic:"Птенчик", pairs: [[7,"G"],[15,"E"],[18,"E"],[28,"A"],[34,"A"]], desc: "«Громкая мама с принципами» – ушёл из шоу-бизнеса, создаёшь уют. Сначала осуждаешь, потом принимаешь. Даже киллеры плачут в твоих объятиях." },
        { id:"8.4", name:"Мин Юнги", fic:"Птенчик", pairs: [[2,"C"],[4,"A"],[22,"B"],[26,"F"],[38,"A"]], desc: "«Властный хищник с разбитым сердцем» – родные отвергли из-за ориентации. Носишь костюмы, ездишь на Майбахе. Жертвуешь карьерой ради близких. Путь от хищника до счастливого мужа." },
        { id:"8.5", name:"Чон Хосок", fic:"Птенчик", pairs: [[1,"I"],[13,"I"],[14,"F"],[19,"I"],[24,"I"]], desc: "«Франтоватый щёголь с боязнью крови» – яркий, энергичный, не можешь работать в полиции из-за вида крови. Верный друг. Тот самый, без которого сюжет бы не сдвинулся." },
        { id:"8.6", name:"Пак Чимин", fic:"Птенчик", pairs: [[1,"C"],[15,"I"],[19,"G"],[33,"E"],[38,"H"]], desc: "«Тактильный котёнок с тайной любовью» – добрый, общительный, лазаешь по верёвочным паркам. Тайно влюблён в друга. Девиз: «обниму и помогу»." },
        { id:"8.7", name:"Ким Тэхён", fic:"Птенчик", pairs: [[10,"G"],[18,"G"],[34,"E"],[39,"H"],[40,"G"]], desc: "«Учитель поцелуев на Рождество» – высокий, яркий, со вкусом. Учишь младших целоваться. Свободный художник, который не боится быть странным." },
        { id:"9.1.1", name:"Чон Чонгук (А)", fic:"Альтернативные мир А", pairs: [[2,"A"],[10,"B"],[26,"G"],[31,"A"],[39,"A"]], desc: "«Замкнутый принц с чёрной кошкой» – альфа, считавший омег скучными. Видишь сны о другом мире. Путь от «не хочу ничего» до альфы, идущего за истинным." },
        { id:"9.1.2", name:"Пак Чимин (А)", fic:"Альтернативные мир А", pairs: [[2,"E"],[4,"B"],[18,"E"],[30,"D"],[40,"B"]], desc: "«Творческая жертва токсичных отношений» – омега, боишься истинности. Встречаешь Хосока – истинного. Путь от забитого омеги до счастливой жены." },
        { id:"9.1.3", name:"Чон Хосок (А)", fic:"Альтернативные мир А", pairs: [[15,"C"],[16,"H"],[23,"F"],[25,"H"],[34,"D"]], desc: "«Идеальный. Точка.» – золотой мальчик, фиктивные отношения. Встречаешь истинного – бросаешь бизнес ради танцев. Путь от «должен» до «хочу»." },
        { id:"9.1.4", name:"Мин Юнги (А)", fic:"Альтернативные мир А", pairs: [[13,"B"],[19,"B"],[22,"D"],[31,"B"],[36,"B"]], desc: "«Ледяная роза» – учёный-биолог, не терпишь прикосновений. Прямолинеен и остроумен. Путь от «не доверяю» до «страстно люблю». Шипы внутри." },
        { id:"9.1.5", name:"Ким Тэхён (А)", fic:"Альтернативные мир А", pairs: [[2,"F"],[10,"A"],[15,"H"],[31,"G"],[39,"D"]], desc: "«Альфа-травматик с аллергией на мясо» – влюблялся в альф, получил травму от омеги. Юнги становится истинным. Путь от ненавидевшего омег до обожающего." },
        { id:"9.1.6", name:"Ким Сокджин (А)", fic:"Альтернативные мир А", pairs: [[9,"E"],[12,"G"],[16,"G"],[23,"D"],[32,"E"]], desc: "«Омега номер один» – фиктивный парень Хосока, беременеешь, он уходит. Путь от отвергнутой до любимой жены из другого мира. Рыбачишь и философствуешь." },
        { id:"9.2.1", name:"Пак Чимин (В)", fic:"Альтернативные мир В", pairs: [[2,"C"],[4,"E"],[12,"F"],[21,"B"],[25,"A"]], desc: "«Романтик, которого предали» – бухгалтер с душой художника. Парень изменил. Появляется Чонгук из мира А. Путь от жертвы обмана до человека, который выбрал себя." },
        { id:"9.2.2", name:"Чон Хосок (В)", fic:"Альтернативные мир В", pairs: [[19,"D"],[24,"D"],[29,"C"],[33,"B"],[38,"C"]], desc: "«Жарче только Килиманджаро» – танцор, видел во снах брата. Встречаешь омегу из мира А – обретаешь равновесие. Путь от тоски по семье до главы семьи." },
        { id:"9.2.3", name:"Мин Юнги (В)", fic:"Альтернативные мир В", pairs: [[1,"G"],[3,"D"],[6,"G"],[14,"I"],[23,"G"]], desc: "«Реставратор, сломавший реальность» – закрытый столяр. Даришь зеркало, которое соединяет миры. Путь от скрытного мастера до активного участника мультивселенной." },
        { id:"9.2.4", name:"Ким Намджун (В)", fic:"Альтернативные мир В", pairs: [[12,"C"],[13,"I"],[16,"E"],[25,"D"],[40,"A"]], desc: "«Запутавшийся альфа, который сбежал в другой мир» – изменил партнёру, потерял всё. Меняешься душами с Чонгуком, уходишь в мир А. Путь от разрушителя до нашедшего себя." },
        { id:"9.2.5", name:"Тэхён+Сокджин (В)", fic:"Альтернативные мир В", pairs: [[1,"D"],[25,"B"],[25,"E"],[30,"C"],[38,"I"]], desc: "«Пара, рождённая из измены» – один прямой, другой заботливый. Оба были обмануты. Встречаются и исцеляют друг друга. Если выпали они – вам нужно пережить предательство, чтобы найти настоящую любовь. Неразделимы." },
        { id:"10.1", name:"Чон Чонгук", fic:"Не отдавай меня ему", pairs: [[2,"H"],[5,"A"],[25,"B"],[30,"A"],[40,"A"]], desc: "«Успешный саморазрушитель с больной спиной» – есть всё, но внутри – ПРЛ. Измена в Гонконге, авиакатастрофа. Путь от идеального мужа по инерции до сломленного, который учится просить помощи." },
        { id:"10.2", name:"Ким Тэхён", fic:"Не отдавай меня ему", pairs: [[16,"I"],[22,"E"],[28,"B"],[35,"I"],[39,"E"]], desc: "«Измотанный ангел с брендом Libertas» – забота о сыне с РАС, муж отстранился. Любишь слово «свобода», но сам в тюрьме. Учишься плавать (метафорически)." },
        { id:"10.3", name:"Пак Чимин", fic:"Не отдавай меня ему", pairs: [[12,"G"],[18,"E"],[21,"C"],[25,"E"],[30,"G"]], desc: "«Эмпатичный волшебник с чувством вины» – гувернёр, ладишь с ребёнком с РАС. Влюбляешься в женатого, умеешь уходить вовремя. Путь от «разрушителя семей» до создателя своей семьи." },
        { id:"10.4", name:"Чон Хосок", fic:"Не отдавай меня ему", pairs: [[1,"H"],[10,"C"],[22,"I"],[25,"D"],[37,"F"]], desc: "«Демон с нервным срывом» – семейный консультант, с которым Чонгук изменил. Путь от случайного соблазнителя до мужа и отца. Пережил крах идеальной жизни, построил настоящую." },
        { id:"10.5", name:"Ким Сокджин", fic:"Не отдавай меня ему", pairs: [[15,"F"],[18,"H"],[20,"F"],[23,"H"],[34,"A"]], desc: "«Весёлый холостяк с неуёмным аппетитом» – лучший друг, крёстный ребёнка. Флиртуешь, наблюдателен, опора в кризис. Путь от лёгкого друга до человека, который тоже может меняться и любить." },
        { id:"10.6", name:"Маргарет Чон", fic:"Не отдавай меня ему", pairs: [[4,"C"],[13,"E"],[14,"B"],[31,"I"],[38,"G"]], desc: "«Змея, которая стала союзницей» – консервативная, не принимала выбор сына, но после его измены встала на сторону Тэхёна. Кризис растопил лёд. Путь от антагониста до бабушки, принявшей всех." },
        { id:"10.7", name:"Юнги (утконос)", fic:"Не отдавай меня ему", pairs: [[3,"G"],[5,"B"],[20,"G"],[32,"C"],[38,"E"]], desc: "«Рациональный ребёнок с идеальным слухом» – шестилетний аутист, называет себя утконосом. Любишь порядок, игрушки Кою и Арджея. Чувствуешь, что отец жив. Если выпал ты – ты гений, которого не понимают нейротипики. И это нормально." },
        { id:"11.1", name:"Ким Намджун", fic:"Нигредо", pairs: [[14,"D"],[20,"B"],[26,"A"],[33,"B"],[39,"C"]], desc: "«Гипнотизёр с алхимией в душе» – манипулируешь, но заботишься. Живёшь в одиночестве и тьме после потери. Тот, кто тянет в свою тьму, но там тепло и безопасно." },
        { id:"11.2", name:"Ким Сокджин", fic:"Нигредо", pairs: [[3,"H"],[18,"H"],[25,"F"],[37,"G"],[40,"F"]], desc: "«Клоун с травмой форта» – весельчак, переживший ужас врача в «форте». Защита – шутить, когда страшно. Исцеляющий, который сам нуждается в исцелении." },
        { id:"11.3", name:"Мин Юнги", fic:"Нигредо", pairs: [[11,"C"],[12,"F"],[17,"A"],[21,"G"],[38,"A"]], desc: "«Волк с горячим сердцем» – хромой следователь, считает, что любовь должна жить без телесности. Удочеряет девочек, учится проявлять нежность. Путь от мёртвой любви до живого волка." },
        { id:"11.4", name:"Чон Хосок", fic:"Нигредо", pairs: [[12,"A"],[19,"D"],[21,"F"],[35,"E"],[40,"D"]], desc: "«Тихий эксперт с ложным дном» – застенчивый ботаник, специалист по розам. Попадаешь в тюрьму по ложному обвинению. Путь от тихони до смелого любовника." },
        { id:"11.5", name:"Пак Чимин", fic:"Нигредо", pairs: [[4,"A"],[5,"H"],[10,"B"],[18,"B"],[25,"G"]], desc: "«Восточный лебедь и лиса в одном флаконе» – гениальный танцовщик, хрупкий внешне, но та ещё лисица с девятью хвостами. Прекрасно готовит и дурит головы мужчинам." },
        { id:"11.6", name:"Ким Тэхён", fic:"Нигредо", pairs: [[1,"E"],[12,"G"],[16,"B"],[27,"F"],[35,"B"]], desc: "«Солнечный офицер с отцом-монстром» – светлый, тёплый, любимец общества. Путь от идеалиста до мудрого мужчины, который видит и свет, и тьму. Ревнивый, но всепрощающий." },
        { id:"11.7", name:"Чон Чонгук", fic:"Нигредо", pairs: [[2,"F"],[10,"C"],[23,"C"],[31,"A"],[40,"E"]], desc: "«Барон-педант с огромным сердцем» – молодой следователь, аскет, педантичен до мании. Подавлял свою ориентацию, считая грехом. Путь от холодного аналитика до свободного любовника." }
    ];


    // --------------------------------------------------------------
    // ЛОГИКА ТЕСТА (без изменений)
    // --------------------------------------------------------------
    let userAnswers = new Array(40).fill(null);
    let currentQuestion = 0;

    function renderQuestion() {
        const q = questions[currentQuestion];
        const optionsHtml = Object.entries(q.options).map(([letter, text]) => `
            <div class="option" data-letter="${letter}">
                <div class="option-letter">${letter}</div>
                <div class="option-text">${text}</div>
            </div>
        `).join('');
        const progressWidth = (currentQuestion / 40) * 100;
        document.getElementById("testArea").innerHTML = `
            <div class="progress-area">
                <div class="progress-bar-bg"><div class="progress-fill" style="width: ${progressWidth}%"></div></div>
                <div class="q-counter">${currentQuestion+1}/40</div>
            </div>
            <div class="question-card">
                <div class="question-text">${q.text}</div>
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                <div class="nav-buttons">
                    <button id="prevBtn" ${currentQuestion===0 ? 'disabled' : ''}>◀ Назад</button>
                    <button id="nextBtn" class="primary">${currentQuestion===39 ? 'Завершить' : 'Далее ▶'}</button>
                </div>
            </div>
        `;
        if (userAnswers[currentQuestion]) {
            const selectedDiv = document.querySelector(`.option[data-letter="${userAnswers[currentQuestion]}"]`);
            if (selectedDiv) selectedDiv.style.background = "#fff1e6";
        }
        document.querySelectorAll('.option').forEach(opt => {
            opt.addEventListener('click', () => {
                const letter = opt.dataset.letter;
                userAnswers[currentQuestion] = letter;
                renderQuestion();
            });
        });
        document.getElementById('prevBtn')?.addEventListener('click', () => {
            if (currentQuestion > 0) { currentQuestion--; renderQuestion(); }
        });
        document.getElementById('nextBtn')?.addEventListener('click', () => {
            if (userAnswers[currentQuestion] === null) { alert("Выберите вариант ответа!"); return; }
            if (currentQuestion === 39) finishTest();
            else { currentQuestion++; renderQuestion(); }
        });
    }

    function finishTest() {
        let bestMatch = null;
        let maxScore = -1;
        for (let ch of characters) {
            let score = 0;
            for (let [qNum, expectedLetter] of ch.pairs) {
                if (userAnswers[qNum-1] === expectedLetter) score++;
            }
            if (score > maxScore) {
                maxScore = score;
                bestMatch = ch;
            }
        }
        if (!bestMatch) bestMatch = characters[0];
        document.getElementById("testArea").innerHTML = `
            <div class="result-box">
                <div class="character-name">${bestMatch.name}</div>
                <div class="character-fic">${bestMatch.fic}</div>
                <div class="character-desc">${bestMatch.desc}<br><br>✨ Совпадений: ${maxScore} из ${bestMatch.pairs.length}<br>🖤 Твой внутренний персонаж найден.</div>
                <button class="restart-btn" id="restartTest">🔁 Пройти заново</button>
            </div>
        `;
        document.getElementById("restartTest")?.addEventListener("click", () => {
            userAnswers = new Array(40).fill(null);
            currentQuestion = 0;
            renderQuestion();
        });
    }

    renderQuestion();
</script>
